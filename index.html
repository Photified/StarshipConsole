<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starship Console Elite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --orange: #ff9900; 
            --pink: #cc99cc; 
            --blue: #9999ff; 
            --gold: #ffcc66; 
            --red: #cc0000; 
            --dark-blue: #08081a;
        }
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: Arial, sans-serif; font-weight: bold; 
            text-transform: uppercase; color: white; 
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        #space-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111122 0%, #000 100%);
            z-index: -1;
        }

        /* RETICLE */
        #reticle {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; 
            border: 2px solid rgba(255, 153, 0, 0.5); border-radius: 50%; 
            pointer-events: none; z-index: 5;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* Lock visual */
        #reticle.locked {
            border-color: #00ff00;
            box-shadow: 0 0 25px #00ff00, inset 0 0 10px #00ff00;
            width: 80px; height: 80px; /* Expands when locked */
        }

        /* LCARS LAYOUT */
        #lcars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-rows: 140px 1fr 100px;
            pointer-events: none; z-index: 10;
        }

        /* HEADER */
        .header-wrap { display: flex; pointer-events: auto; align-items: flex-start; }
        .elbow-main { width: 120px; height: 120px; background: var(--pink); border-bottom-left-radius: 45px; margin-right: 5px; flex-shrink: 0; }
        .top-bars { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .bar-top { 
            background: var(--orange); height: 50px; 
            border-bottom-left-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 25px; padding-right: 25px;
            color: black; font-size: 20px; 
        }
        .bar-sub { background: var(--blue); height: 15px; width: 85%; border-bottom-left-radius: 10px; }
        #nav-data { font-family: monospace; font-size: 16px; color: black; }

        /* SIDEBAR / ACTION BUTTONS */
        .middle-wrap { display: flex; height: 100%; }
        .sidebar { width: 100px; display: flex; flex-direction: column; gap: 5px; padding-top: 10px; pointer-events: auto; }
        
        .action-btn { 
            background: var(--blue); height: 50px; 
            border-radius: 0 25px 25px 0; color: black; 
            font-size: 12px; display: flex; align-items: center; padding-left: 10px; 
            margin-bottom: 5px; cursor: pointer; transition: background 0.2s;
            border: 1px solid transparent; opacity: 0.5; /* Dimmed when inactive */
        }
        /* Buttons light up when target locked */
        .sidebar.active .action-btn { opacity: 1; }
        .action-btn:active { background: white; border-color: var(--blue); }
        
        .reset-btn {
            background: var(--red); height: 40px; margin-top: auto;
            border-radius: 0 20px 20px 0; color: black;
            display: flex; align-items: center; padding-left: 10px; cursor: pointer;
        }

        /* DATA READOUT (Center Screen) */
        #readout { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 350px; background: rgba(0,0,0,0.9); border: 2px solid var(--gold); 
            z-index: 100; padding: 20px; border-radius: 15px; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }
        .readout-header { color: var(--gold); border-bottom: 2px solid var(--gold); margin-bottom: 12px; font-size: 22px; }
        .readout-content { min-height: 60px; }
        .data-label { color: var(--blue); font-size: 11px; display: block; margin-top: 10px; }
        .data-value { color: white; font-size: 16px; display: block; margin-top: 2px; }

        .footer-wrap { background: var(--orange); border-top-left-radius: 50px; display: flex; align-items: center; padding-left: 130px; pointer-events: auto; height: 60px; align-self: end; }
        .btn-main { background: var(--gold); border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; color: black; font-size: 14px; }

        .label { 
            position: absolute; color: var(--blue); border-left: 2px solid var(--gold); 
            padding-left: 6px; font-size: 11px; pointer-events: none;
            background: rgba(0,0,0,0.6); white-space: nowrap; display: none;
        }
    </style>
</head>
<body>

    <div id="space-canvas"></div>
    <div id="reticle"></div>

    <div id="lcars-container">
        <div class="header-wrap">
            <div class="elbow-main"></div>
            <div class="top-bars">
                <div class="bar-top">
                    <span id="header-text">SYSTEM STANDBY</span>
                    <span id="nav-data">HDG: 000 | ELV: 00</span>
                </div>
                <div class="bar-sub"></div>
            </div>
        </div>

        <div class="middle-wrap">
            <div class="sidebar" id="sidebar-ctrl">
                <div class="action-btn" id="btn-scan" style="background:var(--pink)">SCAN</div>
                <div class="action-btn" id="btn-astro" style="background:var(--orange)">ASTRO</div>
                <div class="action-btn" id="btn-intel" style="background:var(--blue)">INTEL</div>
                <div style="flex-grow:1"></div>
                <div class="reset-btn" onclick="location.reload()">RESET</div>
            </div>
        </div>

        <div class="footer-wrap">
            <button id="start-btn" class="btn-main">ENGAGE SENSORS</button>
        </div>
    </div>

    <div id="readout">
        <div class="readout-header" id="obj-header">NO TARGET</div>
        <div class="readout-content" id="obj-body"></div>
        <button class="btn-main" style="width:100%; margin-top:15px;" onclick="document.getElementById('readout').style.display='none'">CLOSE</button>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, starGroup;
        let isUserInteracting = false;
        
        // CAMERA ANGLES
        let lon = 0, lat = 0;
        
        // SWIPE LOGIC
        let onPointerDownLon = 0, onPointerDownLat = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        const sensitivity = 0.2; // REDUCED SENSITIVITY for better control
        
        // SNAPPING LOGIC
        let hoveredStar = null; 
        let targetLon = 0;
        let targetLat = 0;
        let isSnapping = false;

        async function init(userLongitude) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 4000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            starGroup = new THREE.Group();

            // 1. BACKGROUND STARS
            const bgGeo = new THREE.BufferGeometry();
            const bgPos = [];
            for (let i = 0; i < 2000; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = 2 * Math.PI * Math.random();
                const r = 2500;
                bgPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            }
            bgGeo.setAttribute('position', new THREE.Float32BufferAttribute(bgPos, 3));
            scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ color: 0x666699, size: 2 })));

            // 2. LOAD STARS.JSON
            try {
                const response = await fetch('stars.json');
                const stars = await response.json();
                const d = (new Date().getTime() / 86400000) + 2440587.5 - 2451545.0;
                const lst = (280.46 + 360.985 * d + userLongitude) % 360;

                stars.forEach(s => {
                    // Convert RA/Dec to 3D spherical
                    const raRad = (s.ra * 15 - lst) * (Math.PI/180);
                    const decRad = s.dec * (Math.PI/180);
                    const phi = Math.PI/2 - decRad;
                    
                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(10, 8, 8), // Big hit box
                        new THREE.MeshBasicMaterial({ color: 0xffffff })
                    );
                    
                    mesh.position.set(
                        1200 * Math.sin(phi) * Math.cos(raRad),
                        1200 * Math.cos(phi),
                        1200 * Math.sin(phi) * Math.sin(raRad)
                    );
                    
                    // STORE RAW COORDS FOR SNAPPING
                    // We need these to auto-rotate the camera later
                    mesh.userData = s;
                    mesh.userData.snapLon = THREE.MathUtils.radToDeg(raRad); 
                    mesh.userData.snapLat = s.dec; 

                    const el = document.createElement('div');
                    el.className = 'label'; el.innerText = s.name;
                    document.body.appendChild(el);
                    mesh.userData.label = el;
                    starGroup.add(mesh);
                });
                scene.add(starGroup);
            } catch (err) { console.error("Error loading stars:", err); }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // LISTENERS
            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // AUTO-SNAP LOGIC
            if (isSnapping) {
                // Smoothly interpolate current angle towards target angle
                // Simple Linear Interpolation (Lerp)
                lon += (targetLon - lon) * 0.1;
                lat += (targetLat - lat) * 0.1;
                
                // Stop snapping if we are close enough
                if (Math.abs(targetLon - lon) < 0.1 && Math.abs(targetLat - lat) < 0.1) {
                    isSnapping = false;
                }
            }

            // Update Header Text
            let hdg = Math.round(lon % 360);
            if (hdg < 0) hdg += 360;
            document.getElementById('nav-data').innerText = `HDG: ${hdg.toString().padStart(3, '0')} | ELV: ${Math.round(lat)}`;

            // Convert Lat/Lon to LookAt Vector
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(target);
            renderer.render(scene, camera);

            // Labels
            starGroup.children.forEach(mesh => {
                if(mesh.userData.label) {
                    const v = mesh.position.clone().project(camera);
                    if(v.z < 1 && Math.abs(v.x) < 0.9 && Math.abs(v.y) < 0.9) {
                        mesh.userData.label.style.display = 'block';
                        mesh.userData.label.style.left = `${(v.x * .5 + .5) * window.innerWidth + 20}px`;
                        mesh.userData.label.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
                    } else { mesh.userData.label.style.display = 'none'; }
                }
            });
        }

        // --- SWIPE LOGIC ---
        function onPointerDown(event) {
            if (event.target.closest('.action-btn') || event.target.closest('.reset-btn')) return;
            if (event.isPrimary === false) return;
            
            isUserInteracting = true;
            isSnapping = false; // Stop auto-movement if user touches screen
            
            onPointerDownPointerX = event.clientX;
            onPointerDownPointerY = event.clientY;
            onPointerDownLon = lon;
            onPointerDownLat = lat;
        }

        function onPointerMove(event) {
            if (isUserInteracting === true) {
                const deltaX = event.clientX - onPointerDownPointerX;
                const deltaY = event.clientY - onPointerDownPointerY;
                lon = (onPointerDownLon - deltaX * sensitivity);
                lat = (onPointerDownLat + deltaY * sensitivity);
                lat = Math.max(-85, Math.min(85, lat)); 
                return; 
            }

            // HOVER CHECK (Reticle)
            const mouse = new THREE.Vector2(0, 0); 
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            // Use a slightly larger threshold (Raycaster 'params') isn't easy here, 
            // so we rely on the large sphere geometry we made earlier (radius 10)
            const hits = raycaster.intersectObjects(starGroup.children);
            
            if(hits.length > 0) {
                const hit = hits[0].object;
                if(hoveredStar !== hit) {
                    if(hoveredStar) hoveredStar.material.color.setHex(0xffffff);
                    hoveredStar = hit;
                    hoveredStar.material.color.setHex(0x00ff00);
                    document.getElementById('reticle').classList.add('locked');
                    document.getElementById('sidebar-ctrl').classList.add('active'); // Light up buttons
                    
                    // ** PREPARE SNAP TARGET ** // When user lets go, we will snap to this star
                    // Note: Coordinates must handle the 360 wrap-around logic
                    // This simple version snaps to the raw coordinate
                    targetLon = hit.userData.snapLon; 
                    targetLat = hit.userData.snapLat;
                    
                    // Correction for 360 wrap: ensure we spin the shortest way
                    // (Simplification: we just snap to nearest absolute for now)
                    // If lon is 370 and target is 10, we want to go to 370, not back to 10
                    // This complex math is omitted for stability, simple snap works for local stars
                }
            } else {
                if(hoveredStar) {
                    hoveredStar.material.color.setHex(0xffffff);
                    hoveredStar = null;
                    document.getElementById('reticle').classList.remove('locked');
                    document.getElementById('sidebar-ctrl').classList.remove('active');
                }
            }
        }

        function onPointerUp() { 
            isUserInteracting = false; 
            
            // ** TRIGGER SNAP **
            if (hoveredStar) {
                // If we are hovering a star when we let go, SNAP to it
                // We calculate the current "cycle" of rotation (e.g. 360, 720) 
                // to prevent the camera spinning wildly to reset to 0
                const cycle = Math.floor(lon / 360) * 360;
                targetLon = hoveredStar.userData.snapLon + cycle;
                
                // If the jump is massive (crossing 0/360 boundary), adjust cycle
                if (targetLon - lon > 180) targetLon -= 360;
                if (targetLon - lon < -180) targetLon += 360;
                
                targetLat = hoveredStar.userData.snapLat;
                isSnapping = true;
            }
        }


        // --- TRANSLATOR LOGIC ---
        function cleanData(value, type) {
            if (!value) return "UNKNOWN";
            if (type === 'dist') {
                if (value < 20) return value + " LY (CLOSE RANGE)";
                if (value > 1000) return value + " LY (DEEP SPACE)";
                return value + " LIGHT YEARS";
            }
            if (type === 'size') {
                // Remove 'R' and try to parse
                const num = parseFloat(value);
                if (!isNaN(num)) {
                    if (num > 100) return Math.round(num) + "x WIDER THAN SUN";
                    if (num < 2) return "SIMILAR TO SUN";
                    return Math.round(num) + "x SUN SIZE";
                }
                return value;
            }
            if (type === 'type') {
                // Translate Science codes to English
                if (value.includes('B') || value.includes('O')) return "HOT BLUE STAR";
                if (value.includes('M')) return "COOL RED STAR";
                if (value.includes('K')) return "ORANGE STAR";
                if (value.includes('G')) return "YELLOW SUN-LIKE";
                if (value.includes('A')) return "WHITE STAR";
                return "STANDARD STAR";
            }
            return value;
        }

        function showData(btnType) {
            if (!hoveredStar) {
                // Error animation could go here
                return;
            }

            const d = hoveredStar.userData;
            document.getElementById('obj-header').innerText = d.name;

            let content = "";
            if (btnType === 'SCAN') {
                // Navigation Info
                content = `
                    <div class='data-label'>RANGE</div>
                    <div class='data-value'>${cleanData(d.dist, 'dist')}</div>
                    <div class='data-label'>SECTOR</div>
                    <div class='data-value'>${d.con || "UNKNOWN"}</div>
                `;
            } else if (btnType === 'ASTRO') {
                // Science Info
                content = `
                    <div class='data-label'>CLASS</div>
                    <div class='data-value'>${cleanData(d.type, 'type')}</div>
                    <div class='data-label'>DIMENSIONS</div>
                    <div class='data-value'>${cleanData(d.size, 'size')}</div>
                `;
            } else if (btnType === 'INTEL') {
                // Fun Fact
                content = `
                    <div class='data-label'>ARCHIVE DATA</div>
                    <div class='data-value' style='color:#ffcc66; font-style:italic'>"${d.fact}"</div>
                `;
            }

            document.getElementById('obj-body').innerHTML = content;
            document.getElementById('readout').style.display = 'block';
        }

        document.getElementById('btn-scan').addEventListener('click', () => showData('SCAN'));
        document.getElementById('btn-astro').addEventListener('click', () => showData('ASTRO'));
        document.getElementById('btn-intel').addEventListener('click', () => showData('INTEL'));

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('header-text').innerText = "SCANNING SECTOR 001";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => init(p.coords.longitude), () => init(0));
            } else { init(0); }
        });
    </script>
</body>
</html>
