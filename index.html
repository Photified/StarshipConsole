<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starship Console Elite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --orange: #ff9900; --pink: #cc99cc; --blue: #9999ff; 
            --gold: #ffcc66; --red: #cc0000; --dark-blue: #08081a;
            --lcars-bg: rgba(0, 0, 0, 0.9);
        }
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: Arial, sans-serif; font-weight: bold; 
            text-transform: uppercase; color: white; 
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        #space-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000005 100%);
            z-index: -1;
            opacity: 0; 
            transition: opacity 0.5s ease-out;
        }

        /* --- BOOT SCREEN (INTERNAL) --- */
        #boot-screen {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            margin-left: 50px; 
            z-index: 5; 
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            width: auto; 
            pointer-events: none; 
            transition: opacity 0.5s ease-out;
        }

        .boot-header {
            color: var(--red); font-size: 16px; margin-bottom: 8px; letter-spacing: 1px;
            text-shadow: 0 0 5px var(--red);
            text-align: center;
        }
        
        .boot-instruction {
            color: var(--gold); font-size: 12px; margin-bottom: 20px;
            animation: flash 2s infinite;
            text-align: center;
        }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #loading-interface {
            display: none; width: 220px; 
            flex-direction: column; align-items: flex-start;
        }

        .load-text {
            color: var(--blue); font-size: 12px; margin-bottom: 5px; margin-left: 2px;
        }

        .lcars-bar-container {
            display: flex; gap: 3px; width: 100%; height: 15px; 
        }

        .lcars-seg {
            flex: 1; background: #222; border-radius: 2px;
            transition: background 0.1s;
        }
        
        .lcars-seg.on:nth-child(odd) { background: var(--orange); box-shadow: 0 0 8px var(--orange); }
        .lcars-seg.on:nth-child(even) { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
        .lcars-seg.on:last-child { background: var(--red); box-shadow: 0 0 12px var(--red); } 

        .big-btn {
            background: var(--gold); border: none; 
            padding: 12px 30px; 
            border-radius: 25px; font-weight: bold; cursor: pointer; 
            color: black; font-size: 14px; letter-spacing: 1px;
            border: 2px solid var(--orange);
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.3);
            pointer-events: auto; 
        }
        .big-btn:active { background: white; }

        /* --- MAIN UI STYLES --- */
        #reticle {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; 
            border: 2px solid rgba(153, 153, 255, 0.5); border-radius: 50%; 
            pointer-events: none; z-index: 5;
            box-shadow: 0 0 10px rgba(153, 153, 255, 0.3);
            transition: all 0.2s ease;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #reticle.locked {
            border-color: #ff9900;
            box-shadow: 0 0 25px #ff9900, inset 0 0 10px #ff9900;
            width: 80px; height: 80px;
        }
        #reticle::after, #reticle::before {
            content: ''; position: absolute; background: rgba(153, 153, 255, 0.5);
        }
        #reticle::after { top: 50%; left: -10px; right: -10px; height: 1px; }
        #reticle::before { left: 50%; top: -10px; bottom: -10px; width: 1px; }

        #lcars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-rows: 140px 1fr 60px;
            pointer-events: none; z-index: 10;
        }

        .header-wrap { display: flex; pointer-events: auto; align-items: flex-start; }
        .elbow-main { 
            width: 120px; height: 120px; background: var(--pink); 
            border-bottom-left-radius: 45px; margin-right: 5px; flex-shrink: 0; 
            display: flex; align-items: center; justify-content: center;
        }
        .badge-img { width: 80px; height: auto; opacity: 0.9; }
        .top-bars { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .bar-top { 
            background: var(--orange); height: 50px; 
            border-bottom-left-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 25px; padding-right: 25px;
            color: black; font-size: 20px; 
        }
        .bar-sub { background: var(--blue); height: 15px; width: 85%; border-bottom-left-radius: 10px; }
        #nav-data { font-family: monospace; font-size: 16px; color: black; }

        .middle-wrap { display: flex; height: 100%; }
        .sidebar { width: 100px; display: flex; flex-direction: column; gap: 5px; padding-top: 10px; pointer-events: auto; }
        
        .action-btn { 
            background: var(--blue); height: 40px; 
            border-radius: 0 20px 20px 0; color: black; 
            font-size: 11px; display: flex; align-items: center; padding-left: 10px; 
            margin-bottom: 4px; cursor: pointer; transition: background 0.2s;
            border: 1px solid transparent; opacity: 0.6;
        }
        .action-btn.active { opacity: 1; box-shadow: 0 0 10px var(--blue); background: var(--gold); }
        .action-btn:active { background: white; }
        
        .audio-btn {
            background: var(--gold); height: 40px; 
            border-radius: 0 20px 20px 0; display: flex; align-items: center; justify-content: center;
            margin-bottom: 5px; cursor: pointer; transition: all 0.2s;
            pointer-events: auto;
        }
        .audio-btn svg { width: 24px; height: 24px; fill: black; }
        .audio-btn.muted { background: #444; }
        .audio-btn.muted svg { fill: #888; }

        .reset-btn {
            background: var(--red); height: 40px; margin-top: auto;
            border-radius: 0 20px 20px 0; color: black;
            display: flex; align-items: center; padding-left: 10px; cursor: pointer;
            margin-bottom: 15px;
        }

        .zoom-container {
            height: 150px; background: var(--gold);
            margin-bottom: 5px; border-radius: 0 25px 25px 0;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            pointer-events: auto;
        }
        .zoom-label {
            position: absolute; left: 12px; top: 50%; font-size: 10px; color: black; 
            writing-mode: vertical-rl; transform: translateY(-50%) rotate(180deg);
            pointer-events: none;
            white-space: nowrap;
        }
        input[type=range] {
            -webkit-appearance: none; width: 120px; height: 40px;
            background: transparent; transform: rotate(270deg);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 30px; width: 20px;
            background: black; border: 2px solid var(--orange); border-radius: 5px;
            margin-top: -10px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 10px; background: #222; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2);
        }

        #readout { 
            display: none; position: fixed; bottom: 20px; left: 110px; 
            width: calc(100% - 125px); background: var(--lcars-bg); 
            border-top: 30px solid var(--gold); border-bottom-left-radius: 30px;
            z-index: 100; padding: 20px; pointer-events: auto;
            backdrop-filter: blur(5px); box-shadow: 5px 5px 20px rgba(0,0,0,0.8);
            flex-direction: row; align-items: flex-start; gap: 15px; box-sizing: border-box;
        }
        
        #star-visual {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, white, transparent);
            box-shadow: 0 0 20px white; border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0; margin-top: 20px; 
        }

        .readout-info { 
            flex-grow: 1; overflow-y: auto; max-height: 200px; padding-top: 10px; 
            overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
        }

        .readout-header { 
            color: black; background: var(--gold);
            display: inline-block; padding: 5px 25px;
            margin-top: -45px; margin-left: -20px;
            font-size: 20px; font-weight: bold;
            border-bottom-right-radius: 20px; margin-bottom: 15px;
        }
        
        .data-block { margin-bottom: 12px; border-left: 3px solid var(--orange); padding-left: 10px; }
        .data-label { color: var(--gold); font-size: 10px; display: block; margin-bottom: 2px; opacity: 0.8; }
        .data-value { color: var(--blue); font-size: 16px; font-weight: normal; display: block; line-height: 1.3; }

        .close-btn {
            position: absolute; top: -20px; right: -10px;
            width: 40px; height: 40px; background: var(--red);
            border-radius: 50%; color: black; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 3px solid black;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        .footer-wrap { 
            background: var(--orange); 
            border-top-left-radius: 50px; 
            display: flex; align-items: center; padding-left: 130px; 
            pointer-events: auto; height: 60px; align-self: end; width: 100%;
        }

        .label { 
            position: absolute; color: var(--blue); border-left: 2px solid var(--gold); 
            padding-left: 6px; font-size: 11px; pointer-events: none;
            text-shadow: 0 0 4px black; white-space: nowrap; display: none; opacity: 0.8;
        }
    </style>
</head>

        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'lock') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.05);
                osc.frequency.setValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'dismiss') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            createBackgroundLayer(3000, 1.5, 0x6666aa, 0.4);
            createBackgroundLayer(1000, 2.5, 0xaaaaff, 0.7);
            createBackgroundLayer(200, 4.0, 0xffffff, 1.0);

            try {
                // Ensure to load fresh data
                const response = await fetch('stars.json?v=21'); 
                const stars = await response.json();
                
                const d = (new Date().getTime() / 86400000) + 2440587.5 - 2451545.0;
                const lst = (280.46 + 360.985 * d + userLongitude) % 360;

                const starMap = {}; 

                stars.forEach(s => {
                    const coords = coordMap[s.id] || [0, 0];
                    
                    const raRad = (coords[0] * 15 - lst) * (Math.PI/180);
                    const decRad = coords[1] * (Math.PI/180);
                    const phi = Math.PI/2 - decRad;
                    
                    const key = s.con ? s.con.toUpperCase() : "";
                    const starColor = conColors[key] || defaultStarColor;

                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(12, 8, 8), 
                        new THREE.MeshBasicMaterial({ color: starColor })
                    );
                    
                    // --- NEW VISUAL LOGIC FOR BLACK HOLES ---
                    if (s.type && s.type.includes('Black Hole')) {
                        // Make them distinct violet markers on the map
                        mesh.material.color.setHex(0x9933ff);
                        mesh.scale.set(1.5, 1.5, 1.5); // Slightly larger marker
                    }

                    const r = 1200;
                    mesh.position.set(
                        r * Math.sin(phi) * Math.cos(raRad),
                        r * Math.cos(phi),
                        r * Math.sin(phi) * Math.sin(raRad)
                    );
                    
                    mesh.userData = s;
                    mesh.userData.baseColor = s.type.includes('Black Hole') ? 0x9933ff : starColor;

                    const el = document.createElement('div');
                    el.className = 'label'; el.innerText = s.name;
                    el.style.color = '#' + mesh.userData.baseColor.toString(16).padStart(6, '0');
                    el.style.borderLeftColor = '#' + mesh.userData.baseColor.toString(16).padStart(6, '0');
                    
                    document.body.appendChild(el);
                    mesh.userData.label = el;
                    starGroup.add(mesh);
                    
                    if(s.id) starMap[s.id] = mesh.position;
                });

                scene.add(starGroup);

                const lineGeo = new THREE.BufferGeometry();
                const linePos = [];

                constellationPairs.forEach(pair => {
                    const p1 = starMap[pair[0]];
                    const p2 = starMap[pair[1]];

                    if(p1 && p2) {
                        linePos.push(p1.x, p1.y, p1.z);
                        linePos.push(p2.x, p2.y, p2.z);
                    }
                });

                lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
                const mat = new THREE.LineBasicMaterial({ 
                    color: 0x4466aa, 
                    transparent: true, 
                    opacity: 0.35,
                    linewidth: 1
                });
                
                linesGroup.add(new THREE.LineSegments(lineGeo, mat));
                scene.add(linesGroup);

            } catch (err) { console.error(err); }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.getElementById('zoom-slider').addEventListener('input', (e) => {
                camera.fov = parseInt(e.target.value);
                camera.updateProjectionMatrix();
            });

            animate();
        }

        function createBackgroundLayer(count, size, color, opacity) {
            const bgGeo = new THREE.BufferGeometry();
            const bgPos = [];
            for (let i = 0; i < count; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = 2 * Math.PI * Math.random();
                const r = 2000 + Math.random() * 1000; 
                bgPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            }
            bgGeo.setAttribute('position', new THREE.Float32BufferAttribute(bgPos, 3));
            const mat = new THREE.PointsMaterial({ 
                color: color, 
                size: size, 
                transparent: true, 
                opacity: opacity,
                sizeAttenuation: false
            });
            scene.add(new THREE.Points(bgGeo, mat));
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isNaN(lon) || isNaN(lat)) { lon = 0; lat = 0; }

            let hdg = Math.round(lon % 360);
            if (hdg < 0) hdg += 360;
            document.getElementById('nav-data').innerText = `HDG: ${hdg.toString().padStart(3, '0')}`;
            
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(target);
            renderer.render(scene, camera);
            
            if(starGroup) {
                starGroup.children.forEach(mesh => {
                    if(mesh.userData.label) {
                        const v = mesh.position.clone().project(camera);
                        const limit = 0.8; 
                        if(v.z < 1 && Math.abs(v.x) < limit && Math.abs(v.y) < limit) {
                            mesh.userData.label.style.display = 'block';
                            mesh.userData.label.style.left = `${(v.x * .5 + .5) * window.innerWidth + 20}px`;
                            mesh.userData.label.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
                        } else { mesh.userData.label.style.display = 'none'; }
                    }
                });
            }
        }

        function onPointerDown(event) {
            if (event.target.closest('#readout')) return;

            if (event.target.closest('.action-btn') || event.target.closest('.audio-btn') || event.target.closest('.reset-btn') || event.target.id === 'zoom-slider') return;
            if (event.isPrimary === false) return;
            isUserInteracting = true; 
            onPointerDownPointerX = event.clientX; onPointerDownPointerY = event.clientY;
            onPointerDownLon = lon; onPointerDownLat = lat;
        }

        function onPointerMove(event) {
            if (isUserInteracting === true) {
                const deltaX = event.clientX - onPointerDownPointerX;
                const deltaY = event.clientY - onPointerDownPointerY;
                lon = (onPointerDownLon - deltaX * sensitivity);
                lat = (onPointerDownLat + deltaY * sensitivity);
                // LOOK ANGLE INCREASED TO 89.9 DEGREES
                lat = Math.max(-89.9, Math.min(89.9, lat)); 
                return; 
            }
            if(!starGroup) return;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(starGroup.children);
            const buttons = document.querySelectorAll('.action-btn');
            if(hits.length > 0) {
                const hit = hits[0].object;
                if(hoveredStar !== hit) {
                    if(hoveredStar) hoveredStar.material.color.setHex(hoveredStar.userData.baseColor); 
                    hoveredStar = hit;
                    hoveredStar.material.color.setHex(0xffff00); 
                    document.getElementById('reticle').classList.add('locked');
                    buttons.forEach(b => b.classList.add('active'));
                }
            } else {
                if(hoveredStar) {
                    hoveredStar.material.color.setHex(hoveredStar.userData.baseColor);
                    hoveredStar = null;
                    document.getElementById('reticle').classList.remove('locked');
                    buttons.forEach(b => b.classList.remove('active'));
                }
            }
        }

        function onPointerUp() { isUserInteracting = false; }

        function updateStarVisual(d) {
            const visual = document.getElementById('star-visual');
            let color = 'white';
            let shadow = 'white';
            
            // --- BLACK HOLE VISUAL LOGIC ---
            if (d.type && d.type.includes('Black Hole')) {
                // Create an "Accretion Disk" look
                visual.style.background = `radial-gradient(circle at 50% 50%, black 30%, #aa00ff 50%, transparent 70%)`;
                visual.style.boxShadow = `0 0 30px #aa00ff`;
                visual.style.border = 'none'; // Remove standard border
                return; // Exit early
            }

            // Standard Star Visuals
            if (d.type && d.type.includes('Blue')) { color = '#aaddff'; shadow = '#0088ff'; }
            else if (d.type && d.type.includes('White')) { color = '#ffffff'; shadow = '#ccccff'; }
            else if (d.type && d.type.includes('Yellow')) { color = '#ffee00'; shadow = '#ffaa00'; }
            else if (d.type && d.type.includes('Orange')) { color = '#ffaa55'; shadow = '#ff6600'; }
            else if (d.type && d.type.includes('Red')) { color = '#ff5555'; shadow = '#cc0000'; }

            visual.style.background = `radial-gradient(circle at 30% 30%, ${color}, transparent)`;
            visual.style.boxShadow = `0 0 20px ${shadow}`;
            visual.style.border = '1px solid rgba(255,255,255,0.2)';
        }

        function showData(btnType) {
            playSound('click');
            let target = hoveredStar;
            if(!target) {
                let closestDist = Infinity;
                let closestStar = null;
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                if(starGroup && starGroup.children) {
                    starGroup.children.forEach(star => {
                        const v = star.position.clone().project(camera);
                        const d = Math.sqrt(v.x*v.x + v.y*v.y);
                        if(v.z < 1 && d < 0.3 && d < closestDist) {
                            closestDist = d; closestStar = star;
                        }
                    });
                }
                target = closestStar;
            }

            if (!target) {
                document.getElementById('obj-header').innerText = "NO TARGET";
                document.getElementById('obj-body').innerHTML = "<div class='data-label'>STATUS</div><div class='data-value'>ALIGN SENSORS TO STAR</div>";
                document.getElementById('star-visual').style.background = 'gray';
                document.getElementById('star-visual').style.boxShadow = 'none';
                document.getElementById('readout').style.display = 'flex';
                return;
            }

            playSound('lock');
            const d = target.userData;
            document.getElementById('obj-header').innerText = d.name;
            updateStarVisual(d);

            let content = "";
            
            if (btnType === 'NAV') {
                content = `
                    <div class='data-block'>
                        <span class='data-label'>SECTOR</span>
                        <span class='data-value'>${d.con || "Unknown"}</span>
                    </div>
                    <div class='data-block'>
                        <span class='data-label'>DISTANCE</span>
                        <span class='data-value'>${d.dist || "Unknown"}</span>
                    </div>
                    <div class='data-block'>
                        <span class='data-label'>VISIBILITY</span>
                        <span class='data-value'>${d.vis || "Unknown"}</span>
                    </div>
                `;
            } else if (btnType === 'VIS') {
                content = `
                    <div class='data-block'>
                        <span class='data-label'>TYPE</span>
                        <span class='data-value'>${d.type || "Unknown"}</span>
                    </div>
                    <div class='data-block'>
                        <span class='data-label'>BRIGHTNESS</span>
                        <span class='data-value'>${d.lum || "Unknown"}</span>
                    </div>
                    <div class='data-block'>
                        <span class='data-label'>TEMP</span>
                        <span class='data-value'>${d.temp || "Unknown"}</span>
                    </div>
                `;
            } else if (btnType === 'ORB') {
                content = `
                    <div class='data-block'>
                        <span class='data-label'>PLANETS</span>
                        <span class='data-value'>${d.planets || "None Detected"}</span>
                    </div>
                    <div class='data-block'>
                        <span class='data-label'>ROTATION</span>
                        <span class='data-value'>${d.rot || "Unknown"}</span>
                    </div>
                `;
            } else if (btnType === 'PHYS') {
                content = `
                    <div class='data-block'>
                        <span class='data-label'>MASS</span>
                        <span class='data-value'>${d.mass || "Unknown"}</span>
                    </div>
                    <div class='data-block'>
                        <span class='data-label'>RADIUS</span>
                        <span class='data-value'>${d.rad || "Unknown"}</span>
                    </div>
                    <div class='data-block'>
                        <span class='data-label'>AGE</span>
                        <span class='data-value'>${d.age || "Unknown"}</span>
                    </div>
                `;
            } else if (btnType === 'INTEL') {
                let facts = d.facts || ["No intel available."];
                if(typeof facts === 'string') facts = [facts];
                content = facts.map((f, i) => `
                    <div class='data-block'>
                        <span class='data-label'>FACT ${i+1}</span>
                        <span class='data-value' style='font-size:14px'>${f}</span>
                    </div>
                `).join('');
            }

            document.getElementById('obj-body').innerHTML = content;
            document.getElementById('readout').style.display = 'flex';
        }

        document.getElementById('btn-nav').addEventListener('click', () => showData('NAV'));
        document.getElementById('btn-vis').addEventListener('click', () => showData('VIS'));
        document.getElementById('btn-orb').addEventListener('click', () => showData('ORB'));
        document.getElementById('btn-phys').addEventListener('click', () => showData('PHYS'));
        document.getElementById('btn-intel').addEventListener('click', () => showData('INTEL'));
        
        // AUDIO BUTTON LISTENER
        document.getElementById('btn-audio').addEventListener('click', () => {
            isMuted = !isMuted;
            document.getElementById('btn-audio').classList.toggle('muted', isMuted);
            playSound('click'); // Play sound to confirm click unless muted
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            playSound('dismiss');
            document.getElementById('readout').style.display = 'none';
        });

        // BOOT SEQUENCE HANDLER
        document.getElementById('start-btn').addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSound('click'); 

            // 1. Start heavy lifting immediately in background
            document.getElementById('header-text').innerText = "SCANNING SECTOR 001";
            // REMOVED GEOLOCATION CHECK FOR INSTANT LOAD
            init(0);

            // 2. Hide button, show loader
            document.getElementById('start-btn').style.display = 'none';
            document.querySelector('.boot-instruction').style.display = 'none';
            document.querySelector('.boot-header').style.display = 'none';
            document.getElementById('loading-interface').style.display = 'flex';
            
            // 3. Play processing sound looping
            const loadInterval = setInterval(() => playSound('lock'), 200);

            // 4. Animate bar segments
            const segments = document.querySelectorAll('.lcars-seg');
            let currentSeg = 0;
            
            const segInterval = setInterval(() => {
                if(currentSeg < segments.length) {
                    segments[currentSeg].classList.add('on');
                    currentSeg++;
                } else {
                    // FINISHED
                    clearInterval(segInterval);
                    clearInterval(loadInterval);
                    playSound('click'); // Final success beep
                    
                    // Fade out boot screen
                    document.getElementById('boot-screen').style.opacity = '0';
                    document.getElementById('space-canvas').style.opacity = '1';
                    document.getElementById('reticle').style.opacity = '1';
                    
                    setTimeout(() => {
                        document.getElementById('boot-screen').style.display = 'none';
                    }, 500);
                }
            }, 150); // Speed of loading bar
        });
    </script>
</body>
</html>
