<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starship Console Elite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --orange: #ff9900; --pink: #cc99cc; --blue: #9999ff; 
            --gold: #ffcc66; --red: #cc0000; --dark-blue: #08081a;
            --lcars-bg: rgba(0, 0, 0, 0.85);
        }
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: Arial, sans-serif; font-weight: bold; 
            text-transform: uppercase; color: white; 
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        #space-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Deep Space Gradient Background */
            background: radial-gradient(circle at center, #0a0a1a 0%, #000005 100%);
            z-index: -1;
        }

        /* RETICLE */
        #reticle {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; 
            border: 2px solid rgba(153, 153, 255, 0.5); border-radius: 50%; 
            pointer-events: none; z-index: 5;
            box-shadow: 0 0 10px rgba(153, 153, 255, 0.3);
            transition: all 0.2s ease;
        }
        #reticle.locked {
            border-color: #ff9900;
            box-shadow: 0 0 25px #ff9900, inset 0 0 10px #ff9900;
            width: 80px; height: 80px;
        }
        #reticle::after, #reticle::before {
            content: ''; position: absolute; background: rgba(153, 153, 255, 0.5);
        }
        #reticle::after { top: 50%; left: -10px; right: -10px; height: 1px; }
        #reticle::before { left: 50%; top: -10px; bottom: -10px; width: 1px; }

        /* LCARS LAYOUT */
        #lcars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-rows: 140px 1fr 100px;
            pointer-events: none; z-index: 10;
        }

        /* HEADER */
        .header-wrap { display: flex; pointer-events: auto; align-items: flex-start; }
        .elbow-main { width: 120px; height: 120px; background: var(--pink); border-bottom-left-radius: 45px; margin-right: 5px; flex-shrink: 0; }
        .top-bars { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .bar-top { 
            background: var(--orange); height: 50px; 
            border-bottom-left-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 25px; padding-right: 25px;
            color: black; font-size: 20px; 
        }
        .bar-sub { background: var(--blue); height: 15px; width: 85%; border-bottom-left-radius: 10px; }
        #nav-data { font-family: monospace; font-size: 16px; color: black; }

        /* SIDEBAR */
        .middle-wrap { display: flex; height: 100%; }
        .sidebar { width: 100px; display: flex; flex-direction: column; gap: 5px; padding-top: 10px; pointer-events: auto; }
        
        .action-btn { 
            background: var(--blue); height: 50px; 
            border-radius: 0 25px 25px 0; color: black; 
            font-size: 12px; display: flex; align-items: center; padding-left: 10px; 
            margin-bottom: 5px; cursor: pointer; transition: background 0.2s;
            border: 1px solid transparent; opacity: 0.6;
        }
        .action-btn.active { opacity: 1; box-shadow: 0 0 10px var(--blue); background: var(--gold); }
        .action-btn:active { background: white; }
        
        .reset-btn {
            background: var(--red); height: 40px; margin-top: auto;
            border-radius: 0 20px 20px 0; color: black;
            display: flex; align-items: center; padding-left: 10px; cursor: pointer;
        }

        /* ZOOM SLIDER */
        .zoom-container {
            height: 150px; background: var(--gold);
            margin-bottom: 5px; border-radius: 0 25px 25px 0;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .zoom-label {
            position: absolute; left: 5px; top: 10px; font-size: 10px; color: black; 
            writing-mode: vertical-rl; transform: rotate(180deg);
        }
        input[type=range] {
            -webkit-appearance: none; width: 120px; height: 40px;
            background: transparent; transform: rotate(270deg);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 30px; width: 20px;
            background: black; border: 2px solid var(--orange); border-radius: 5px;
            margin-top: -10px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 10px; background: #222; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2);
        }

        /* READOUT DASHBOARD */
        #readout { 
            display: none; 
            position: fixed; 
            bottom: 20px; left: 110px; 
            width: calc(100% - 125px);
            background: var(--lcars-bg); 
            border-top: 30px solid var(--gold); 
            border-bottom-left-radius: 30px;
            z-index: 100; padding: 20px; 
            pointer-events: auto;
            backdrop-filter: blur(5px);
            box-shadow: 5px 5px 20px rgba(0,0,0,0.8);
            flex-direction: row; align-items: center; gap: 20px;
            box-sizing: border-box;
        }
        
        #star-visual {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, white, transparent);
            box-shadow: 0 0 20px white; border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .readout-info { flex-grow: 1; }
        .readout-header { 
            color: black; background: var(--gold);
            display: inline-block; padding: 5px 15px;
            margin-top: -55px; margin-left: -20px;
            font-size: 20px; font-weight: bold;
            border-bottom-right-radius: 20px;
            margin-bottom: 25px;
        }
        
        .data-label { color: var(--gold); font-size: 10px; display: inline-block; width: 80px; text-align: right; margin-right: 10px;}
        .data-value { color: var(--blue); font-size: 16px; display: inline-block; font-weight: normal; }
        .data-row { margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 2px; }

        .close-btn {
            position: absolute; top: -20px; right: -10px;
            width: 40px; height: 40px; background: var(--red);
            border-radius: 50%; color: black; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 3px solid black;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        .footer-wrap { background: var(--orange); border-top-left-radius: 50px; display: flex; align-items: center; padding-left: 130px; pointer-events: auto; height: 60px; align-self: end; }
        .btn-main { background: var(--gold); border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; color: black; font-size: 14px; }

        .label { 
            position: absolute; color: var(--blue); border-left: 2px solid var(--gold); 
            padding-left: 6px; font-size: 11px; pointer-events: none;
            text-shadow: 0 0 4px black;
            white-space: nowrap; display: none;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="space-canvas"></div>
    <div id="reticle"></div>

    <div id="lcars-container">
        <div class="header-wrap">
            <div class="elbow-main"></div>
            <div class="top-bars">
                <div class="bar-top">
                    <span id="header-text">SYSTEM STANDBY</span>
                    <span id="nav-data">HDG: 000</span>
                </div>
                <div class="bar-sub"></div>
            </div>
        </div>

        <div class="middle-wrap">
            <div class="sidebar">
                <div class="action-btn" id="btn-nav" style="background:var(--pink)">NAV</div>
                <div class="action-btn" id="btn-vis" style="background:var(--orange)">ANALYSIS</div>
                <div class="action-btn" id="btn-intel" style="background:var(--blue)">INTEL</div>
                <div class="zoom-container">
                    <span class="zoom-label">MAGNIFICATION</span>
                    <input type="range" id="zoom-slider" min="40" max="120" value="100">
                </div>
                <div style="flex-grow:1"></div>
                <div class="reset-btn" onclick="location.reload()">RESET</div>
            </div>
        </div>

        <div class="footer-wrap">
            <button id="start-btn" class="btn-main">ENGAGE SENSORS</button>
        </div>
    </div>

    <div id="readout">
        <div class="close-btn" onclick="document.getElementById('readout').style.display='none'">X</div>
        <div id="star-visual"></div>
        <div class="readout-info">
            <div class="readout-header" id="obj-header">NO TARGET</div>
            <div id="obj-body"></div>
        </div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, starGroup, linesGroup;
        let isUserInteracting = false;
        
        let lon = 0, lat = 0;
        let onPointerDownLon = 0, onPointerDownLat = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        const sensitivity = 0.2; 
        
        let hoveredStar = null; 

        // LCARS COLORS for specific constellations
        const conColors = {
            "URSA MAJOR": 0x00ff00,    // Green
            "URSA MINOR": 0xcc00ff,    // Purple
            "ORION": 0x00aaff,         // Light Blue
            "SCORPIUS": 0xff3300,      // Red/Orange
            "CASSIOPEIA": 0xff0099,    // Magenta
            "CYGNUS": 0x00ffff,        // Cyan
            "CRUX": 0xffff00,          // Yellow
            "CANIS MAJOR": 0x0055ff,   // Deep Blue
            "LEO": 0xffaa00,           // Gold
            "GEMINI": 0xffaaee         // Pink
        };
        const defaultStarColor = 0xffffff;

        // ACCURATE CONSTELLATION ATLAS (ID Pairs)
        const constellationPairs = [
            ['ALK', 'MIZ'], ['MIZ', 'ALI'], ['ALI', 'MEG'], ['MEG', 'PHEC'], 
            ['PHEC', 'MER'], ['MER', 'DUB'], ['DUB', 'MEG'],
            ['POLA', 'KOC'], ['KOC', 'PHER'], 
            ['BET', 'BEL'], ['MINT', 'ALNI'], ['ALNI', 'ALN'], ['SAI', 'RIG'], 
            ['BEL', 'MINT'], ['BET', 'ALNI'], ['SAI', 'ALNI'], ['RIG', 'MINT'], 
            ['ANT', 'GRA'], ['GRA', 'DSCH'], ['ANT', 'WEI'], ['WEI', 'SAR'], ['SAR', 'SHA'], ['SHA', 'LES'], 
            ['DEN', 'SAD'], ['SAD', 'ALB'], ['SAD', 'GIE'], 
            ['REG', 'ALGIE'], ['ALGIE', 'ZOS'],
            ['CAS', 'POL'], ['POL', 'ALH'],
            ['SIR', 'MIRZ'], ['SIR', 'ADH'], ['ADH', 'WES'], ['WES', 'ALUD'],
            ['ACR', 'GAC'], ['MIM', 'GAC'], 
            ['CAPH', 'SCH'], ['SCH', 'RUCH'], ['RUCH', 'SEGIN'],
            ['MARK', 'SCH_PEG'], ['SCH_PEG', 'ALPHER'], 
            ['ALPHER', 'MIR'], ['MIR', 'ALMA'], 
            ['KAUS', 'KAUSM'], ['KAUSM', 'KAUSB'], ['KAUSM', 'ALN_SAG'], 
            ['ALN_SAG', 'ASK'], ['ASK', 'NUN'], ['ASK', 'KAUS']
        ];

        // MOCK COORDINATES
        const coordMap = {
            "SIR": [6.75, -16.72], "CAN": [6.40, -52.70], "RIGK": [14.66, -60.83], "ARC": [14.26, 19.18],
            "VEG": [18.62, 38.78], "CAP": [5.27, 45.99], "RIG": [5.24, -8.20], "PRO": [7.65, 5.22],
            "BET": [5.92, 7.41], "ACH": [1.63, -57.23], "HAD": [14.06, -60.37], "ALT": [19.85, 8.87],
            "ACR": [12.44, -63.10], "ALD": [4.60, 16.51], "SPI": [13.42, -11.16], "ANT": [16.49, -26.43],
            "POL": [7.76, 28.02], "FOM": [22.96, -29.62], "DEN": [20.69, 45.28], "MIM": [12.80, -59.68],
            "REG": [10.14, 11.96], "ADH": [6.98, -28.97], "SHA": [17.56, -37.10], "CAS": [7.58, 31.88],
            "GAC": [12.52, -57.11], "BEL": [5.42, 6.35], "ELN": [5.43, 28.60], "MIA": [9.22, -69.71],
            "ALN": [5.60, -1.20], "ALNI": [5.68, -1.94], "ALI": [12.90, 55.96], "DUB": [11.06, 61.75],
            "MIR": [3.41, 49.86], "WES": [7.14, -26.39], "SAR": [17.62, -42.99], "KAUS": [18.40, -34.38],
            "AVI": [8.37, -59.50], "ALK": [13.79, 49.31], "MEN": [5.99, 44.95], "ATR": [16.81, -69.03],
            "ALH": [6.63, 16.39], "PEA": [20.42, -56.73], "ALS": [8.74, -54.70], "MIRZ": [6.38, -17.96],
            "ALP": [9.46, -8.66], "POLA": [2.53, 89.26], "HAM": [2.12, 23.46], "ALG": [3.13, 40.96],
            "DIP": [0.72, -17.99], "NUN": [18.92, -26.29], "ALPHE": [15.58, 26.71], "SCH": [0.67, 56.54],
            "ASP": [9.28, -59.27], "SUH": [9.13, -43.43], "CAPH": [0.15, 59.15], "RUCH": [1.43, 60.23],
            "SEGIN": [1.90, 63.67], "MER": [11.03, 56.38], "PHEC": [11.89, 53.69], "MEG": [12.25, 57.03],
            "MIZ": [13.40, 54.92], "ALCO": [13.41, 54.98], "KOC": [14.84, 74.15], "PHER": [15.34, 71.83],
            "MINT": [5.53, -0.30], "SAI": [5.79, -9.67], "GRA": [16.09, -19.80], "DSCH": [16.00, -22.62],
            "WEI": [16.83, -42.36], "LES": [17.51, -37.29], "ALGIE": [10.33, 19.84], "ZOS": [11.23, 20.52],
            "ALB": [19.51, 27.96], "SAD": [20.37, 40.26], "GIE": [20.79, 33.97], "MARK": [23.08, 15.21],
            "SCH_PEG": [23.06, 28.08], "ALPHER": [0.14, 29.09], "MIR": [1.16, 35.62], "ALMA": [2.06, 42.33],
            "MENK": [3.04, 4.09], "KAUSM": [18.46, -29.83], "KAUSB": [18.47, -25.42], "ALN_SAG": [18.09, -30.42],
            "ASK": [19.04, -29.88], "POLI": [18.00, -21.06], "RUK": [19.39, -40.34], "ANA": [0.44, -42.30],
            "ALUD": [7.40, -29.30], "MUL": [7.06, -15.63], "FUR": [6.34, -30.06], "RAS": [17.58, 12.56],
            "CEB": [17.72, 4.57], "SAB": [17.17, -15.72], "YED": [16.24, -3.69], "MAR": [16.51, -10.57],
            "ETAMIN": [17.94, 51.49], "ALD": [21.31, 62.58], "ALF": [21.48, 70.56], "ERR": [23.66, 77.63],
            "TAR": [19.77, 10.61], "ALSH": [19.92, 6.41], "DENE": [19.08, 13.86], "ROT": [20.62, 14.66],
            "SUA": [20.66, 15.91], "ZUB": [14.84, -16.04], "ZUBN": [15.28, -9.38], "UNUK": [15.74, 6.42],
            "VIN": [13.04, 10.96], "POR": [12.69, -1.45], "COR": [12.93, 38.31], "IZA": [14.76, 27.07],
            "MUPH": [13.91, 18.39], "ALKA": [15.41, 40.39], "NEK": [15.03, 38.31], "SEGINUS": [14.53, 38.30]
        };

        async function init(userLongitude) {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000005, 0.0002);

            camera = new THREE.PerspectiveCamera(100, window.innerWidth / window.innerHeight, 1, 4000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            starGroup = new THREE.Group();
            linesGroup = new THREE.Group();

            createBackgroundLayer(3000, 1.5, 0x6666aa, 0.4);
            createBackgroundLayer(1000, 2.5, 0xaaaaff, 0.7);
            createBackgroundLayer(200, 4.0, 0xffffff, 1.0);

            try {
                // Ensure to load fresh data
                const response = await fetch('stars.json?v=13'); 
                const stars = await response.json();
                
                const d = (new Date().getTime() / 86400000) + 2440587.5 - 2451545.0;
                const lst = (280.46 + 360.985 * d + userLongitude) % 360;

                const starMap = {}; 

                stars.forEach(s => {
                    const coords = coordMap[s.id] || [0, 0];
                    
                    const raRad = (coords[0] * 15 - lst) * (Math.PI/180);
                    const decRad = coords[1] * (Math.PI/180);
                    const phi = Math.PI/2 - decRad;
                    
                    // --- RESTORED CONSTELLATION COLORS ---
                    // Lookup key in Uppercase to match the dictionary
                    const key = s.con ? s.con.toUpperCase() : "";
                    const starColor = conColors[key] || defaultStarColor;

                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(12, 8, 8), 
                        new THREE.MeshBasicMaterial({ color: starColor })
                    );
                    
                    const r = 1200;
                    mesh.position.set(
                        r * Math.sin(phi) * Math.cos(raRad),
                        r * Math.cos(phi),
                        r * Math.sin(phi) * Math.sin(raRad)
                    );
                    
                    mesh.userData = s;
                    mesh.userData.baseColor = starColor;

                    const el = document.createElement('div');
                    el.className = 'label'; el.innerText = s.name;
                    el.style.color = '#' + starColor.toString(16).padStart(6, '0');
                    el.style.borderLeftColor = '#' + starColor.toString(16).padStart(6, '0');
                    
                    document.body.appendChild(el);
                    mesh.userData.label = el;
                    starGroup.add(mesh);
                    
                    if(s.id) starMap[s.id] = mesh.position;
                });

                scene.add(starGroup);

                const lineGeo = new THREE.BufferGeometry();
                const linePos = [];

                constellationPairs.forEach(pair => {
                    const p1 = starMap[pair[0]];
                    const p2 = starMap[pair[1]];

                    if(p1 && p2) {
                        linePos.push(p1.x, p1.y, p1.z);
                        linePos.push(p2.x, p2.y, p2.z);
                    }
                });

                lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
                const mat = new THREE.LineBasicMaterial({ 
                    color: 0x4466aa, 
                    transparent: true, 
                    opacity: 0.35,
                    linewidth: 1
                });
                
                linesGroup.add(new THREE.LineSegments(lineGeo, mat));
                scene.add(linesGroup);

            } catch (err) { console.error(err); }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.getElementById('zoom-slider').addEventListener('input', (e) => {
                camera.fov = parseInt(e.target.value);
                camera.updateProjectionMatrix();
            });

            animate();
        }

        function createBackgroundLayer(count, size, color, opacity) {
            const bgGeo = new THREE.BufferGeometry();
            const bgPos = [];
            for (let i = 0; i < count; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = 2 * Math.PI * Math.random();
                const r = 2000 + Math.random() * 1000; 
                bgPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            }
            bgGeo.setAttribute('position', new THREE.Float32BufferAttribute(bgPos, 3));
            const mat = new THREE.PointsMaterial({ 
                color: color, 
                size: size, 
                transparent: true, 
                opacity: opacity,
                sizeAttenuation: false
            });
            scene.add(new THREE.Points(bgGeo, mat));
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isNaN(lon) || isNaN(lat)) { lon = 0; lat = 0; }

            let hdg = Math.round(lon % 360);
            if (hdg < 0) hdg += 360;
            document.getElementById('nav-data').innerText = `HDG: ${hdg.toString().padStart(3, '0')}`;
            
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(target);
            renderer.render(scene, camera);
            
            if(starGroup) {
                starGroup.children.forEach(mesh => {
                    if(mesh.userData.label) {
                        const v = mesh.position.clone().project(camera);
                        const limit = 0.8; 
                        if(v.z < 1 && Math.abs(v.x) < limit && Math.abs(v.y) < limit) {
                            mesh.userData.label.style.display = 'block';
                            mesh.userData.label.style.left = `${(v.x * .5 + .5) * window.innerWidth + 20}px`;
                            mesh.userData.label.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
                        } else { mesh.userData.label.style.display = 'none'; }
                    }
                });
            }
        }

        function onPointerDown(event) {
            if (event.target.closest('.action-btn') || event.target.closest('.reset-btn') || event.target.id === 'zoom-slider') return;
            if (event.isPrimary === false) return;
            isUserInteracting = true; 
            onPointerDownPointerX = event.clientX; onPointerDownPointerY = event.clientY;
            onPointerDownLon = lon; onPointerDownLat = lat;
        }

        function onPointerMove(event) {
            if (isUserInteracting === true) {
                const deltaX = event.clientX - onPointerDownPointerX;
                const deltaY = event.clientY - onPointerDownPointerY;
                lon = (onPointerDownLon - deltaX * sensitivity);
                lat = (onPointerDownLat + deltaY * sensitivity);
                // LOOK ANGLE INCREASED TO 89.9 DEGREES
                lat = Math.max(-89.9, Math.min(89.9, lat)); 
                return; 
            }
            if(!starGroup) return;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(starGroup.children);
            const buttons = document.querySelectorAll('.action-btn');
            if(hits.length > 0) {
                const hit = hits[0].object;
                if(hoveredStar !== hit) {
                    if(hoveredStar) hoveredStar.material.color.setHex(hoveredStar.userData.baseColor); 
                    hoveredStar = hit;
                    hoveredStar.material.color.setHex(0xffff00); 
                    document.getElementById('reticle').classList.add('locked');
                    buttons.forEach(b => b.classList.add('active'));
                }
            } else {
                if(hoveredStar) {
                    hoveredStar.material.color.setHex(hoveredStar.userData.baseColor);
                    hoveredStar = null;
                    document.getElementById('reticle').classList.remove('locked');
                    buttons.forEach(b => b.classList.remove('active'));
                }
            }
        }

        function onPointerUp() { isUserInteracting = false; }

        function updateStarVisual(d) {
            const visual = document.getElementById('star-visual');
            let color = 'white';
            let shadow = 'white';
            
            if (d.type && d.type.includes('Blue')) { color = '#aaddff'; shadow = '#0088ff'; }
            else if (d.type && d.type.includes('White')) { color = '#ffffff'; shadow = '#ccccff'; }
            else if (d.type && d.type.includes('Yellow')) { color = '#ffee00'; shadow = '#ffaa00'; }
            else if (d.type && d.type.includes('Orange')) { color = '#ffaa55'; shadow = '#ff6600'; }
            else if (d.type && d.type.includes('Red')) { color = '#ff5555'; shadow = '#cc0000'; }

            visual.style.background = `radial-gradient(circle at 30% 30%, ${color}, transparent)`;
            visual.style.boxShadow = `0 0 20px ${shadow}`;
        }

        function showData(btnType) {
            let target = hoveredStar;
            if(!target) {
                let closestDist = Infinity;
                let closestStar = null;
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                if(starGroup && starGroup.children) {
                    starGroup.children.forEach(star => {
                        const v = star.position.clone().project(camera);
                        const d = Math.sqrt(v.x*v.x + v.y*v.y);
                        if(v.z < 1 && d < 0.3 && d < closestDist) {
                            closestDist = d; closestStar = star;
                        }
                    });
                }
                target = closestStar;
            }

            if (!target) {
                document.getElementById('obj-header').innerText = "NO TARGET";
                document.getElementById('obj-body').innerHTML = "<div class='data-label'>STATUS</div><div class='data-value'>ALIGN SENSORS TO STAR</div>";
                document.getElementById('star-visual').style.background = 'gray';
                document.getElementById('star-visual').style.boxShadow = 'none';
                document.getElementById('readout').style.display = 'flex';
                return;
            }

            const d = target.userData;
            document.getElementById('obj-header').innerText = d.name;
            updateStarVisual(d);

            let content = "";
            
            if (btnType === 'NAV') {
                content = `
                    <div class='data-row'><div class='data-label'>SECTOR</div><div class='data-value'>${d.con || "Unknown"}</div></div>
                    <div class='data-row'><div class='data-label'>DISTANCE</div><div class='data-value'>${d.dist || "Unknown"}</div></div>
                    <div class='data-row'><div class='data-label'>VISIBILITY</div><div class='data-value'>${d.vis || "Unknown"}</div></div>
                `;
            } else if (btnType === 'VIS') {
                content = `
                    <div class='data-row'><div class='data-label'>TYPE</div><div class='data-value'>${d.type || "Unknown"}</div></div>
                    <div class='data-row'><div class='data-label'>BRIGHTNESS</div><div class='data-value'>${d.lum || "Unknown"}</div></div>
                    <div class='data-row'><div class='data-label'>TEMP</div><div class='data-value'>${d.temp || "Unknown"}</div></div>
                `;
            } else if (btnType === 'INTEL') {
                let facts = d.facts || ["No intel available."];
                if(typeof facts === 'string') facts = [facts];
                content = facts.map(f => `<div style='margin-bottom:8px; color:#ffcc66; font-size:13px; line-height:1.4'>• ${f}</div>`).join('');
            }

            document.getElementById('obj-body').innerHTML = content;
            document.getElementById('readout').style.display = 'flex';
        }

        document.getElementById('btn-nav').addEventListener('click', () => showData('NAV'));
        document.getElementById('btn-vis').addEventListener('click', () => showData('VIS'));
        document.getElementById('btn-intel').addEventListener('click', () => showData('INTEL'));

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('header-text').innerText = "SCANNING SECTOR 001";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => init(p.coords.longitude), () => init(0));
            } else { init(0); }
        });
    </script>
</body>
</html>
