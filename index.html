<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starship Console: Long Range</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --orange: #ff9900; --pink: #cc99cc; --blue: #9999ff; 
            --gold: #ffcc66; --red: #cc0000; --dark-blue: #111122;
        }
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: Arial, sans-serif; font-weight: bold; 
            text-transform: uppercase; color: white; 
        }

        /* SPACE BACKGROUND */
        #space-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            z-index: -1;
        }

        /* CROSSHAIR / TARGETING RETICLE */
        #reticle {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border: 2px solid rgba(255, 153, 0, 0.3);
            border-radius: 50%; pointer-events: none; z-index: 5;
        }
        #reticle::before { content: ''; position: absolute; top: 50%; left: -10px; width: 60px; height: 1px; background: rgba(255, 153, 0, 0.3); }
        #reticle::after { content: ''; position: absolute; left: 50%; top: -10px; width: 1px; height: 60px; background: rgba(255, 153, 0, 0.3); }

        #lcars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-rows: 140px 1fr 100px;
            pointer-events: none; z-index: 10;
        }

        .header-wrap { display: flex; pointer-events: auto; align-items: flex-start; }
        .elbow-main { width: 120px; height: 120px; background: var(--pink); border-bottom-left-radius: 45px; margin-right: 5px; flex-shrink: 0; }
        .top-bars { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .bar-top { background: var(--orange); height: 50px; border-bottom-left-radius: 20px; display: flex; align-items: center; padding-left: 25px; color: black; font-size: 20px; }
        .bar-sub { background: var(--blue); height: 15px; width: 85%; border-bottom-left-radius: 10px; }

        .middle-wrap { display: flex; height: 100%; }
        .sidebar { width: 100px; display: flex; flex-direction: column; gap: 5px; padding-top: 10px; pointer-events: auto; }
        .nav-pill { background: var(--blue); height: 35px; border-radius: 0 20px 20px 0; color: black; font-size: 10px; display: flex; align-items: center; padding-left: 10px; }
        
        #readout { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 320px; background: rgba(0,0,0,0.9); border: 2px solid var(--gold); 
            z-index: 100; padding: 20px; border-radius: 15px; pointer-events: auto;
        }
        .readout-title { color: var(--gold); border-bottom: 2px solid var(--gold); margin-bottom: 12px; font-size: 22px; }

        .footer-wrap { background: var(--orange); border-top-left-radius: 50px; display: flex; align-items: center; padding-left: 130px; pointer-events: auto; height: 60px; align-self: end; }
        .btn-main { background: var(--gold); border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; color: black; }

        .label { 
            position: absolute; color: var(--blue); border-left: 2px solid var(--blue); 
            padding-left: 5px; font-size: 10px; pointer-events: none; background: rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="space-bg"></div>
    <div id="reticle"></div>

    <div id="lcars-container">
        <div class="header-wrap">
            <div class="elbow-main"></div>
            <div class="top-bars">
                <div class="bar-top">LONG RANGE SENSOR SCAN</div>
                <div class="bar-sub"></div>
            </div>
        </div>
        <div class="middle-wrap">
            <div class="sidebar">
                <div class="nav-pill" style="background:var(--pink)">SENSOR</div>
                <div class="nav-pill">V-LINK</div>
                <div class="nav-pill" style="background:var(--orange)">DEEP SKY</div>
                <div class="nav-pill" style="background:var(--red); margin-top:20px;" onclick="location.reload()">RESET</div>
            </div>
        </div>
        <div class="footer-wrap">
            <button id="start-btn" class="btn-main">INITIALIZE SENSORS</button>
            <div id="status-text" style="margin-left:20px; color:black; font-size:12px;">OFFLINE</div>
        </div>
    </div>

    <div id="readout">
        <div class="readout-title" id="obj-name">SCANNING...</div>
        <div id="obj-data" style="font-size:14px; margin-bottom:20px; line-height:1.5;"></div>
        <button class="btn-main" style="width:100%" onclick="document.getElementById('readout').style.display='none'">DISMISS</button>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, starGroup, starMap = new Map();
        let targetQuaternion = new THREE.Quaternion();
        const lerpFactor = 0.08; // Smoothness: lower is heavier/slower

        async function init(lon) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 3000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            starGroup = new THREE.Group();
            
            // 1. GENERATE BACKGROUND STAR DENSITY (The "Fun" part)
            const bgGeo = new THREE.BufferGeometry();
            const bgCoords = [];
            for (let i = 0; i < 1500; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = 2 * Math.PI * Math.random();
                const r = 1500;
                bgCoords.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            }
            bgGeo.setAttribute('position', new THREE.Float32BufferAttribute(bgCoords, 3));
            const bgPoints = new THREE.Points(bgGeo, new THREE.PointsMaterial({ color: 0x444466, size: 2 }));
            scene.add(bgPoints);

            // 2. LOAD ACTUAL STARS
            try {
                const response = await fetch('stars.json');
                const stars = await response.json();
                const d = (new Date().getTime() / 86400000) + 2440587.5 - 2451545.0;
                const lst = (280.46 + 360.985 * d + lon) % 360;

                stars.forEach(s => {
                    const raRad = (s.ra * 15 - lst) * (Math.PI/180);
                    const decRad = s.dec * (Math.PI/180);
                    const phi = Math.PI/2 - decRad;
                    const mesh = new THREE.Mesh(new THREE.SphereGeometry(3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                    
                    mesh.position.set(1000*Math.sin(phi)*Math.cos(raRad), 1000*Math.cos(phi), 1000*Math.sin(phi)*Math.sin(raRad));
                    mesh.userData = s;
                    
                    const el = document.createElement('div');
                    el.className = 'label';
                    el.innerText = s.name;
                    document.body.appendChild(el);
                    mesh.userData.label = el;
                    starMap.set(s.id, mesh);
                    starGroup.add(mesh);
                });

                scene.add(starGroup);
                animate();
            } catch (e) { console.error("Database failed", e); }
        }

        function animate() {
            requestAnimationFrame(animate);

            // SMOOTH MOTION ENGINE
            camera.quaternion.slerp(targetQuaternion, lerpFactor);

            renderer.render(scene, camera);

            starGroup.children.forEach(mesh => {
                if(mesh.userData.label) {
                    const v = mesh.position.clone().project(camera);
                    if(v.z < 1 && Math.abs(v.x) < 0.9 && Math.abs(v.y) < 0.9) {
                        mesh.userData.label.style.display = 'block';
                        mesh.userData.label.style.left = `${(v.x * .5 + .5) * window.innerWidth + 5}px`;
                        mesh.userData.label.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
                    } else { mesh.userData.label.style.display = 'none'; }
                }
            });
        }

        // SENSOR LOGIC
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('status-text').innerText = "CALIBRATING...";
            
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }

            navigator.geolocation.getCurrentPosition((p) => {
                init(p.coords.longitude);
                window.addEventListener('deviceorientation', (e) => {
                    let alpha = e.webkitCompassHeading ? (360 - e.webkitCompassHeading) : e.alpha;
                    const euler = new THREE.Euler(
                        THREE.MathUtils.degToRad(e.beta), 
                        THREE.MathUtils.degToRad(alpha), 
                        -THREE.MathUtils.degToRad(e.gamma), 
                        'YXZ'
                    );
                    targetQuaternion.setFromEuler(euler);
                }, false);
                document.getElementById('status-text').innerText = "ONLINE";
            });
        });

        // TACTICAL SELECTION
        window.addEventListener('click', (e) => {
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(starGroup.children);
            if(hits.length > 0) {
                const d = hits[0].object.userData;
                document.getElementById('obj-name').innerText = d.name;
                document.getElementById('obj-data').innerHTML = `SECTOR: ${d.con}<br>MAGNITUDE: ${d.dist}<br><br>DATA:<br>${d.fact}`;
                document.getElementById('readout').style.display = 'block';
            }
        });
    </script>
</body>
</html>
