<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starship Console - LCARS</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --orange: #ff9900; --pink: #cc99cc; --blue: #9999ff; --gold: #ffcc66; --red: #cc0000; }
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; font-weight: bold; text-transform: uppercase; color: white; }
        #camera-feed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.5; }
        
        /* LCARS FRAME */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; border: 4px solid black; box-sizing: border-box; }
        #header { position: absolute; top: 0; left: 0; width: 100%; display: flex; pointer-events: auto; }
        .elbow { width: 100px; height: 100px; background: var(--pink); border-bottom-left-radius: 40px; }
        .bar { flex-grow: 1; background: var(--orange); height: 40px; border-bottom-left-radius: 20px; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; color: black; font-size: 18px; }
        
        #side-nav { position: absolute; left: 0; top: 110px; width: 90px; display: flex; flex-direction: column; gap: 5px; pointer-events: auto; }
        .pill { background: var(--blue); height: 35px; border-radius: 0 20px 20px 0; color: black; font-size: 11px; display: flex; align-items: center; padding-left: 10px; cursor: pointer; }

        /* DATA READOUT */
        #readout { 
            display: none; position: fixed; top: 50%; left: 55%; transform: translate(-50%, -50%); 
            width: 70%; max-width: 300px; background: rgba(0,0,0,0.9); border: 2px solid var(--gold); 
            z-index: 100; padding: 20px; border-radius: 20px; pointer-events: auto;
        }
        .readout-header { color: var(--gold); border-bottom: 2px solid var(--gold); margin-bottom: 10px; font-size: 20px; }

        #footer { position: absolute; bottom: 0; width: 100%; height: 60px; background: var(--orange); border-top-left-radius: 40px; z-index: 10; display: flex; align-items: center; padding-left: 110px; pointer-events: auto; }
        .btn { background: var(--gold); border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; color: black; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="header"><div class="elbow"></div><div class="bar">SENSORS SCANNING</div></div>
        <div id="side-nav">
            <div class="pill" style="background:var(--pink)">STELLAR</div>
            <div class="pill">OBJECTS</div>
            <div class="pill" style="background:var(--orange)">SECTOR 7G</div>
        </div>
    </div>
    
    <video id="camera-feed" autoplay playsinline></video>

    <div id="readout">
        <div class="readout-header" id="obj-name">SCANNING...</div>
        <div id="obj-data" style="font-size: 13px; margin-bottom: 15px; line-height: 1.4;"></div>
        <button class="btn" style="width:100%" onclick="document.getElementById('readout').style.display='none'">DISMISS</button>
    </div>

    <div id="footer">
        <button id="start-btn" class="btn">ENGAGE SENSORS</button>
        <div id="status" style="margin-left: 20px; color: black; font-size: 12px;">READY</div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';
        let scene, camera, renderer, starGroup, starMap = new Map();
        let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();

        async function init(lon) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            starGroup = new THREE.Group();
            
            // Load Star Data
            const response = await fetch('stars.json');
            const stars = await response.json();
            
            // Calculate Sidereal Time
            const d = (new Date().getTime() / 86400000) + 2440587.5 - 2451545.0;
            const lst = (280.46 + 360.985 * d + lon) % 360;

            stars.forEach(s => {
                const raRad = (s.ra * 15 - lst) * (Math.PI/180);
                const decRad = s.dec * (Math.PI/180);
                const phi = Math.PI/2 - decRad;
                
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(1.2, 8, 8), 
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                mesh.position.set(120*Math.sin(phi)*Math.cos(raRad), 120*Math.cos(phi), 120*Math.sin(phi)*Math.sin(raRad));
                mesh.userData = s;
                
                starMap.set(s.id, mesh);
                starGroup.add(mesh);
            });

            // Draw Constellation Lines (Connections by ID)
            const lineMat = new THREE.LineBasicMaterial({ color: 0x9999ff, transparent: true, opacity: 0.5 });
            const connections = [
                ["S1", "S2"], ["S2", "S3"], ["S3", "S4"], ["S4", "S1"], // Sample Rectangle/Constellation
                ["D1", "D2"], ["D2", "D3"], ["D3", "D4"] // Sample Dipper tail
            ];

            connections.forEach(pair => {
                const p1 = starMap.get(pair[0]);
                const p2 = starMap.get(pair[1]);
                if(p1 && p2) {
                    const geo = new THREE.BufferGeometry().setFromPoints([p1.position, p2.position]);
                    starGroup.add(new THREE.Line(geo, lineMat));
                }
            });

            scene.add(starGroup);
            animate();
        }

        // Tapping Stars
        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(starGroup.children.filter(o => o instanceof THREE.Mesh));
            if(hits.length > 0) {
                const d = hits[0].object.userData;
                document.getElementById('obj-name').innerText = d.name;
                document.getElementById('obj-data').innerHTML = `COORD: ${d.ra}h / ${d.dec}°<br>DIST: ${d.dist} LY<br>CON: ${d.con}<br><br>${d.fact}`;
                document.getElementById('readout').style.display = 'block';
            }
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('status').innerText = "CALIBRATING...";
            navigator.geolocation.getCurrentPosition(async (p) => {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('camera-feed').srcObject = stream;
                if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission();
                window.addEventListener('deviceorientation', (e) => {
                    camera.rotation.set(THREE.MathUtils.degToRad(e.beta), THREE.MathUtils.degToRad(e.alpha), -THREE.MathUtils.degToRad(e.gamma), 'YXZ');
                });
                init(p.coords.longitude);
                document.getElementById('status').innerText = "SCANNER ACTIVE";
            });
        });

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    </script>
	<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Starship Systems: Service Worker Registered'))
                .catch(err => console.log('Starship Systems: Offline Mode Failed', err));
        });
    }
</script>
	
</body>
</html>
