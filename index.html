<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starship Console Elite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --orange: #ff9900; --pink: #cc99cc; --blue: #9999ff; 
            --gold: #ffcc66; --red: #cc0000; --dark-blue: #08081a;
        }
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: Arial, sans-serif; font-weight: bold; 
            text-transform: uppercase; color: white; 
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        #space-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111122 0%, #000 100%);
            z-index: -1;
        }

        /* RETICLE */
        #reticle {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; 
            border: 2px solid rgba(255, 153, 0, 0.5); border-radius: 50%; 
            pointer-events: none; z-index: 5;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
            transition: all 0.3s ease;
        }
        #reticle.locked {
            border-color: #ffff00;
            box-shadow: 0 0 25px #ffff00, inset 0 0 10px #ffff00;
            width: 80px; height: 80px;
        }

        /* LCARS LAYOUT */
        #lcars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-rows: 140px 1fr 100px;
            pointer-events: none; z-index: 10;
        }

        /* HEADER */
        .header-wrap { display: flex; pointer-events: auto; align-items: flex-start; }
        .elbow-main { width: 120px; height: 120px; background: var(--pink); border-bottom-left-radius: 45px; margin-right: 5px; flex-shrink: 0; }
        .top-bars { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .bar-top { 
            background: var(--orange); height: 50px; 
            border-bottom-left-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 25px; padding-right: 25px;
            color: black; font-size: 20px; 
        }
        .bar-sub { background: var(--blue); height: 15px; width: 85%; border-bottom-left-radius: 10px; }
        #nav-data { font-family: monospace; font-size: 16px; color: black; }

        /* SIDEBAR */
        .middle-wrap { display: flex; height: 100%; }
        .sidebar { width: 100px; display: flex; flex-direction: column; gap: 5px; padding-top: 10px; pointer-events: auto; }
        
        .action-btn { 
            background: var(--blue); height: 50px; 
            border-radius: 0 25px 25px 0; color: black; 
            font-size: 12px; display: flex; align-items: center; padding-left: 10px; 
            margin-bottom: 5px; cursor: pointer; transition: background 0.2s;
            border: 1px solid transparent; opacity: 0.6;
        }
        .action-btn.active { opacity: 1; box-shadow: 0 0 10px var(--blue); }
        .action-btn:active { background: white; }
        
        .reset-btn {
            background: var(--red); height: 40px; margin-top: auto;
            border-radius: 0 20px 20px 0; color: black;
            display: flex; align-items: center; padding-left: 10px; cursor: pointer;
        }

        /* ZOOM SLIDER FIXED */
        .zoom-container {
            height: 150px; background: var(--gold);
            margin-bottom: 5px; border-radius: 0 25px 25px 0;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .zoom-label {
            position: absolute; left: 5px; top: 10px; font-size: 10px; color: black; 
            writing-mode: vertical-rl; transform: rotate(180deg);
        }
        input[type=range] {
            -webkit-appearance: none; width: 120px; height: 40px;
            background: transparent; transform: rotate(270deg);
        }
        /* The Thumb (Handle) */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 30px; width: 20px;
            background: black; border: 2px solid var(--orange); border-radius: 5px;
            margin-top: -10px;
        }
        /* The Track (Bar) - Made dark black so it's visible on Gold */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 10px; background: #222; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2);
        }

        /* SOLID LCARS POPUP */
        #readout { 
            display: none; 
            position: fixed; 
            bottom: 20px; /* Floating slightly off bottom */
            left: 110px; /* CLEARS THE SIDEBAR */
            width: calc(100% - 125px); /* Fills rest of screen width */
            background: black; /* Solid Black Background */
            border-top: 30px solid var(--gold); /* LCARS Header Bar */
            border-bottom-left-radius: 30px;
            z-index: 100; padding: 20px; 
            pointer-events: auto;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.8);
            flex-direction: row;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
        }
        
        #star-visual {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, white, transparent);
            box-shadow: 0 0 20px white; border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .readout-info { flex-grow: 1; }
        /* Header is now part of the gold bar visually */
        .readout-header { 
            color: black; 
            background: var(--gold);
            display: inline-block;
            padding: 5px 15px;
            margin-top: -55px; /* Pulls text up into the orange border */
            margin-left: -20px;
            font-size: 20px; 
            font-weight: bold;
            border-bottom-right-radius: 20px;
        }
        
        .data-label { color: var(--gold); font-size: 10px; display: inline-block; width: 80px; text-align: right; margin-right: 10px;}
        .data-value { color: var(--blue); font-size: 16px; display: inline-block; font-weight: normal; }
        .data-row { margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 2px; }

        .close-btn {
            position: absolute; top: -20px; right: -10px;
            width: 40px; height: 40px; background: var(--red);
            border-radius: 50%; color: black; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 3px solid black;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        .footer-wrap { background: var(--orange); border-top-left-radius: 50px; display: flex; align-items: center; padding-left: 130px; pointer-events: auto; height: 60px; align-self: end; }
        .btn-main { background: var(--gold); border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; color: black; font-size: 14px; }

        .label { 
            position: absolute; color: var(--blue); border-left: 2px solid var(--gold); 
            padding-left: 6px; font-size: 11px; pointer-events: none;
            background: rgba(0,0,0,0.6); white-space: nowrap; display: none;
        }
    </style>
</head>
<body>

    <div id="space-canvas"></div>
    <div id="reticle"></div>

    <div id="lcars-container">
        <div class="header-wrap">
            <div class="elbow-main"></div>
            <div class="top-bars">
                <div class="bar-top">
                    <span id="header-text">SYSTEM STANDBY</span>
                    <span id="nav-data">HDG: 000</span>
                </div>
                <div class="bar-sub"></div>
            </div>
        </div>

        <div class="middle-wrap">
            <div class="sidebar">
                <div class="action-btn" id="btn-scan" style="background:var(--pink)">SCAN</div>
                <div class="action-btn" id="btn-astro" style="background:var(--orange)">ASTRO</div>
                <div class="action-btn" id="btn-intel" style="background:var(--blue)">INTEL</div>
                <div class="zoom-container">
                    <span class="zoom-label">MAGNIFICATION</span>
                    <input type="range" id="zoom-slider" min="40" max="120" value="100">
                </div>
                <div style="flex-grow:1"></div>
                <div class="reset-btn" onclick="location.reload()">RESET</div>
            </div>
        </div>

        <div class="footer-wrap">
            <button id="start-btn" class="btn-main">ENGAGE SENSORS</button>
        </div>
    </div>

    <div id="readout">
        <div class="close-btn" onclick="document.getElementById('readout').style.display='none'">X</div>
        <div id="star-visual"></div>
        <div class="readout-info">
            <div class="readout-header" id="obj-header">NO TARGET</div>
            <div id="obj-body"></div>
        </div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, starGroup;
        let isUserInteracting = false;
        
        let lon = 0, lat = 0;
        let onPointerDownLon = 0, onPointerDownLat = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        const sensitivity = 0.2; 
        
        let isSnapping = false;
        let targetLon = 0, targetLat = 0;
        let hoveredStar = null; 

        const conColors = {
            "URSA MAJOR": 0x00ff00, "URSA MINOR": 0xcc00ff, "ORION": 0x00aaff, "SCORPIUS": 0xff3300,
            "CASSIOPEIA": 0xff0099, "CYGNUS": 0x00ffff, "CRUX": 0xffff00, "CANIS MAJOR": 0x0055ff,
            "LEO": 0xffaa00, "GEMINI": 0xffaaee
        };
        const defaultStarColor = 0xffffff;

        async function init(userLongitude) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(100, window.innerWidth / window.innerHeight, 1, 4000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            starGroup = new THREE.Group();

            const bgGeo = new THREE.BufferGeometry();
            const bgPos = [];
            for (let i = 0; i < 2000; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = 2 * Math.PI * Math.random();
                const r = 2500;
                bgPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            }
            bgGeo.setAttribute('position', new THREE.Float32BufferAttribute(bgPos, 3));
            scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ color: 0x444466, size: 2 })));

            // CACHE BUSTER: '?v=3' forces reload
            try {
                const response = await fetch('stars.json?v=3'); 
                const stars = await response.json();
                const d = (new Date().getTime() / 86400000) + 2440587.5 - 2451545.0;
                const lst = (280.46 + 360.985 * d + userLongitude) % 360;

                stars.forEach(s => {
                    const raRad = (s.ra * 15 - lst) * (Math.PI/180);
                    const decRad = s.dec * (Math.PI/180);
                    const phi = Math.PI/2 - decRad;
                    
                    const starColor = conColors[s.con] || defaultStarColor;

                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(12, 8, 8), 
                        new THREE.MeshBasicMaterial({ color: starColor })
                    );
                    
                    const r = 1200;
                    mesh.position.set(
                        r * Math.sin(phi) * Math.cos(raRad),
                        r * Math.cos(phi),
                        r * Math.sin(phi) * Math.sin(raRad)
                    );
                    
                    mesh.userData = s;
                    mesh.userData.baseColor = starColor;

                    const el = document.createElement('div');
                    el.className = 'label'; el.innerText = s.name;
                    el.style.color = '#' + starColor.toString(16).padStart(6, '0');
                    el.style.borderLeftColor = '#' + starColor.toString(16).padStart(6, '0');
                    
                    document.body.appendChild(el);
                    mesh.userData.label = el;
                    starGroup.add(mesh);
                });
                scene.add(starGroup);
            } catch (err) { console.error(err); }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
            document.getElementById('zoom-slider').addEventListener('input', (e) => {
                camera.fov = parseInt(e.target.value);
                camera.updateProjectionMatrix();
            });

            animate();
        }

        function getStarAngles(position) {
            const r = Math.sqrt(position.x*position.x + position.y*position.y + position.z*position.z);
            const safeY = Math.max(-1, Math.min(1, position.y / r));
            const phi = Math.acos(safeY);
            const theta = Math.atan2(position.x, position.z); 
            let starLat = 90 - THREE.MathUtils.radToDeg(phi);
            let starLon = THREE.MathUtils.radToDeg(theta); 
            if(starLon < 0) starLon += 360;
            return { lon: starLon, lat: starLat };
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isNaN(lon) || isNaN(lat)) { lon = 0; lat = 0; isSnapping = false; }
            if(isSnapping) {
                lat += (targetLat - lat) * 0.1;
                lon += (targetLon - lon) * 0.1;
                if(Math.abs(targetLat - lat) < 0.05 && Math.abs(targetLon - lon) < 0.05) isSnapping = false;
            }
            let hdg = Math.round(lon % 360);
            if (hdg < 0) hdg += 360;
            document.getElementById('nav-data').innerText = `HDG: ${hdg.toString().padStart(3, '0')}`;
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(target);
            renderer.render(scene, camera);
            starGroup.children.forEach(mesh => {
                if(mesh.userData.label) {
                    const v = mesh.position.clone().project(camera);
                    const limit = 0.9;
                    if(v.z < 1 && Math.abs(v.x) < limit && Math.abs(v.y) < limit) {
                        mesh.userData.label.style.display = 'block';
                        mesh.userData.label.style.left = `${(v.x * .5 + .5) * window.innerWidth + 20}px`;
                        mesh.userData.label.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
                    } else { mesh.userData.label.style.display = 'none'; }
                }
            });
        }

        function onPointerDown(event) {
            if (event.target.closest('.action-btn') || event.target.closest('.reset-btn') || event.target.id === 'zoom-slider') return;
            if (event.isPrimary === false) return;
            isUserInteracting = true; isSnapping = false; 
            onPointerDownPointerX = event.clientX; onPointerDownPointerY = event.clientY;
            onPointerDownLon = lon; onPointerDownLat = lat;
        }

        function onPointerMove(event) {
            if (isUserInteracting === true) {
                const deltaX = event.clientX - onPointerDownPointerX;
                const deltaY = event.clientY - onPointerDownPointerY;
                lon = (onPointerDownLon - deltaX * sensitivity);
                lat = (onPointerDownLat + deltaY * sensitivity);
                lat = Math.max(-85, Math.min(85, lat)); 
                return; 
            }
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(starGroup.children);
            const buttons = document.querySelectorAll('.action-btn');
            if(hits.length > 0) {
                const hit = hits[0].object;
                if(hoveredStar !== hit) {
                    if(hoveredStar) hoveredStar.material.color.setHex(hoveredStar.userData.baseColor); 
                    hoveredStar = hit;
                    hoveredStar.material.color.setHex(0xffff00); 
                    document.getElementById('reticle').classList.add('locked');
                    buttons.forEach(b => b.classList.add('active'));
                }
            } else {
                if(hoveredStar) {
                    hoveredStar.material.color.setHex(hoveredStar.userData.baseColor);
                    hoveredStar = null;
                    document.getElementById('reticle').classList.remove('locked');
                    buttons.forEach(b => b.classList.remove('active'));
                }
            }
        }

        function onPointerUp() { 
            isUserInteracting = false; 
            if(hoveredStar) {
                isSnapping = false; 
                const angles = getStarAngles(hoveredStar.position);
                let currentLon = lon; 
                let diff = angles.lon - (currentLon % 360);
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                targetLon = currentLon + diff;
                targetLat = angles.lat;
                isSnapping = true;
            }
        }

        function updateStarVisual(d) {
            const visual = document.getElementById('star-visual');
            let color = 'white';
            let shadow = 'white';
            
            // Check if type exists to avoid crashes
            const type = d.type || "G";
            
            if (type.includes('O') || type.includes('B')) { color = '#aaddff'; shadow = '#0088ff'; }
            else if (type.includes('A')) { color = '#ffffff'; shadow = '#ccccff'; }
            else if (type.includes('F')) { color = '#fff8e0'; shadow = '#ffddaa'; }
            else if (type.includes('G')) { color = '#ffee00'; shadow = '#ffaa00'; }
            else if (type.includes('K')) { color = '#ffaa55'; shadow = '#ff6600'; }
            else if (type.includes('M')) { color = '#ff5555'; shadow = '#cc0000'; }

            visual.style.background = `radial-gradient(circle at 30% 30%, ${color}, transparent)`;
            visual.style.boxShadow = `0 0 20px ${shadow}`;
        }

        function cleanData(val, type) {
            if(!val) return "UNKNOWN";
            if(type === 'dist') {
                if(val < 10) return val + " LY (CLOSE RANGE)";
                if(val > 1000) return val + " LY (DEEP SPACE)";
                return val + " LIGHT YEARS";
            }
            if(type === 'size') {
                const num = parseFloat(val);
                if(isNaN(num)) return "UNKNOWN SIZE";
                if(num > 100) return Math.round(num) + "x WIDER THAN SUN";
                if(num < 2) return "SIMILAR TO SUN";
                return Math.round(num) + "x SUN SIZE";
            }
            if(type === 'type') {
                if(val.includes('B') || val.includes('O')) return "HOT BLUE STAR";
                if(val.includes('M')) return "COOL RED STAR";
                if(val.includes('K')) return "ORANGE STAR";
                if(val.includes('G')) return "YELLOW SUN-LIKE";
                if(val.includes('A')) return "WHITE STAR";
                return "STANDARD STAR";
            }
            return val;
        }

        function showData(btnType) {
            let target = hoveredStar;
            if(!target) {
                // If aiming fails, use closest
                let closestDist = Infinity;
                let closestStar = null;
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                starGroup.children.forEach(star => {
                    const v = star.position.clone().project(camera);
                    const d = Math.sqrt(v.x*v.x + v.y*v.y);
                    if(v.z < 1 && d < 0.3 && d < closestDist) {
                        closestDist = d; closestStar = star;
                    }
                });
                target = closestStar;
            }

            if (!target) {
                document.getElementById('obj-header').innerText = "NO TARGET";
                document.getElementById('obj-body').innerHTML = "<div class='data-label'>STATUS</div><div class='data-value'>ALIGN SENSORS TO STAR</div>";
                document.getElementById('star-visual').style.background = 'gray';
                document.getElementById('star-visual').style.boxShadow = 'none';
                document.getElementById('readout').style.display = 'flex';
                return;
            }

            const d = target.userData;
            document.getElementById('obj-header').innerText = d.name;
            
            updateStarVisual(d);

            let content = "";
            if (btnType === 'SCAN') {
                content = `
                    <div class='data-row'><div class='data-label'>RANGE</div><div class='data-value'>${cleanData(d.dist, 'dist')}</div></div>
                    <div class='data-row'><div class='data-label'>SECTOR</div><div class='data-value'>${d.con || "UNKNOWN"}</div></div>
                `;
            } else if (btnType === 'ASTRO') {
                content = `
                    <div class='data-row'><div class='data-label'>CLASS</div><div class='data-value'>${cleanData(d.type, 'type')}</div></div>
                    <div class='data-row'><div class='data-label'>SIZE</div><div class='data-value'>${cleanData(d.size, 'size')}</div></div>
                    <div class='data-row'><div class='data-label'>TEMP</div><div class='data-value'>${d.temp || "UNKNOWN"}</div></div>
                `;
            } else if (btnType === 'INTEL') {
                content = `
                    <div class='data-row'><div class='data-label'>LUMINOSITY</div><div class='data-value'>${d.lum || "UNKNOWN"}</div></div>
                    <div class='data-row'><div class='data-label'>DATABASE</div><div class='data-value' style='color:#ffcc66; font-style:italic'>"${d.fact}"</div></div>
                `;
            }

            document.getElementById('obj-body').innerHTML = content;
            document.getElementById('readout').style.display = 'flex';
        }

        document.getElementById('btn-scan').addEventListener('click', () => showData('SCAN'));
        document.getElementById('btn-astro').addEventListener('click', () => showData('ASTRO'));
        document.getElementById('btn-intel').addEventListener('click', () => showData('INTEL'));

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('header-text').innerText = "SCANNING SECTOR 001";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => init(p.coords.longitude), () => init(0));
            } else { init(0); }
        });
    </script>
</body>
</html>
