<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starship Console Elite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --orange: #ff9900; --pink: #cc99cc; --blue: #9999ff; 
            --gold: #ffcc66; --red: #cc0000; --dark-blue: #333366;
        }
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: Arial, sans-serif; font-weight: bold; 
            text-transform: uppercase; color: white; 
        }

        #camera-feed { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: -1; opacity: 0.5; 
        }

        /* FULL LCARS GRID SYSTEM */
        #lcars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-rows: 140px 1fr 100px;
            pointer-events: none; z-index: 10;
        }

        .header-wrap { display: flex; pointer-events: auto; }
        .elbow-main { 
            width: 120px; height: 120px; background: var(--pink); 
            border-bottom-left-radius: 45px; margin-right: 5px; 
        }
        .top-bars { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .bar-top { 
            background: var(--orange); height: 45px; border-bottom-left-radius: 20px;
            display: flex; align-items: center; justify-content: flex-end; 
            padding-right: 20px; color: black; font-size: 20px; 
        }
        .bar-sub { background: var(--blue); height: 15px; width: 85%; border-bottom-left-radius: 10px; }

        .sidebar { 
            width: 100px; display: flex; flex-direction: column; 
            gap: 5px; padding-top: 10px; pointer-events: auto; 
        }
        .nav-pill { 
            background: var(--blue); height: 35px; border-radius: 0 20px 20px 0; 
            color: black; font-size: 10px; display: flex; align-items: center; 
            padding-left: 10px; 
        }
        
        /* DATA READOUT MODAL */
        #readout { 
            display: none; position: fixed; top: 50%; left: 55%; transform: translate(-50%, -50%); 
            width: 75%; max-width: 320px; background: rgba(0,0,0,0.95); border: 2px solid var(--gold); 
            z-index: 100; padding: 20px; border-radius: 25px; pointer-events: auto;
            box-shadow: 0 0 20px var(--gold);
        }
        .readout-title { color: var(--gold); border-bottom: 2px solid var(--gold); margin-bottom: 12px; font-size: 22px; }

        /* FOOTER AREA */
        .footer-wrap { 
            background: var(--orange); border-top-left-radius: 50px; 
            display: flex; align-items: center; padding-left: 130px; 
            pointer-events: auto; height: 60px; align-self: end;
        }
        .btn-main { 
            background: var(--gold); border: none; padding: 12px 25px; 
            border-radius: 25px; font-weight: bold; cursor: pointer; color: black; font-size: 14px;
        }

        /* INTERACTIVE 3D LABELS */
        .label { 
            position: absolute; color: white; border-left: 3px solid var(--gold); 
            padding-left: 8px; font-size: 11px; pointer-events: none;
            background: rgba(0,0,0,0.6); white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="lcars-container">
        <div class="header-wrap">
            <div class="elbow-main"></div>
            <div class="top-bars">
                <div class="bar-top">M702 SECTOR 50201 SCANNING</div>
                <div class="bar-sub"></div>
            </div>
        </div>
        <div class="middle-wrap">
            <div class="sidebar">
                <div class="nav-pill" style="background:var(--pink)">STELLAR</div>
                <div class="nav-pill">OBJECTS</div>
                <div class="nav-pill" style="background:var(--orange)">SECTOR 7G</div>
                <div class="nav-pill" style="background:var(--red); margin-top:20px;" onclick="location.reload()">RESET</div>
            </div>
        </div>
        <div class="footer-wrap">
            <button id="start-btn" class="btn-main">ENGAGE SENSORS</button>
            <div id="status-text" style="margin-left:20px; color:black; font-size:12px;">NAV-LINK READY</div>
        </div>
    </div>
    
    <video id="camera-feed" autoplay playsinline></video>

    <div id="readout">
        <div class="readout-title" id="obj-name">SCANNING...</div>
        <div id="obj-data" style="font-size:14px; margin-bottom:20px; line-height:1.5;"></div>
        <button class="btn-main" style="width:100%" onclick="document.getElementById('readout').style.display='none'">DISMISS</button>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';
        let scene, camera, renderer, starGroup, starMap = new Map();
        let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();

        // CONSTELLATION CONNECTION DATABASE
       // Add these to your connections array in index.html
const connections = [
    ["BET", "ALN"], ["ALN", "RIG"], ["BEL", "ALN"], ["ALN", "SAI"], ["BET", "BEL"], // Orion
    ["DUB", "MER"], ["MER", "PHE"], ["PHE", "MEG"], ["MEG", "ALI"], ["ALI", "MIZ"], ["MIZ", "ALK"], // Big Dipper
    ["CAS1", "CAS2"], // Cassiopeia snippet
    ["VEG", "DENEB"], ["DENEB", "ALTAIR"], ["ALTAIR", "VEG"] // Summer Triangle
];

        async function init(lon) {
            scene = new THREE.Scene();
            // Field of View 70 matches the average phone camera to stop visual drift
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 1, 3000);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            starGroup = new THREE.Group();
            
            try {
                const response = await fetch('stars.json');
                const stars = await response.json();
                
                const d = (new Date().getTime() / 86400000) + 2440587.5 - 2451545.0;
                const lst = (280.46 + 360.985 * d + lon) % 360;

                stars.forEach(s => {
                    const raRad = (s.ra * 15 - lst) * (Math.PI/180);
                    const decRad = s.dec * (Math.PI/180);
                    const phi = Math.PI/2 - decRad;
                    
                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(2.5, 8, 8), 
                        new THREE.MeshBasicMaterial({ color: 0xffffff })
                    );
                    
                    // Radius set to 1200 pushes stars to the background so they don't 'drift'
                    mesh.position.set(1200*Math.sin(phi)*Math.cos(raRad), 1200*Math.cos(phi), 1200*Math.sin(phi)*Math.sin(raRad));
                    mesh.userData = s;
                    
                    const el = document.createElement('div');
                    el.className = 'label';
                    el.innerText = s.name;
                    document.body.appendChild(el);
                    mesh.userData.label = el;

                    starMap.set(s.id, mesh);
                    starGroup.add(mesh);
                });

                // DRAW CONSTELLATION LINES
                const lineMat = new THREE.LineBasicMaterial({ color: 0x9999ff, transparent: true, opacity: 0.4 });
                connections.forEach(pair => {
                    const p1 = starMap.get(pair[0]);
                    const p2 = starMap.get(pair[1]);
                    if(p1 && p2) {
                        const geo = new THREE.BufferGeometry().setFromPoints([p1.position, p2.position]);
                        starGroup.add(new THREE.Line(geo, lineMat));
                    }
                });

                scene.add(starGroup);
                animate();
            } catch (e) {
                console.error("Database failed", e);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
            
            starGroup.children.forEach(mesh => {
                if(mesh.userData.label) {
                    const v = mesh.position.clone().project(camera);
                    if(v.z < 1 && v.x > -1 && v.x < 1 && v.y > -1 && v.y < 1) {
                        mesh.userData.label.style.display = 'block';
                        mesh.userData.label.style.left = `${(v.x * .5 + .5) * window.innerWidth + 10}px`;
                        mesh.userData.label.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
                    } else {
                        mesh.userData.label.style.display = 'none';
                    }
                }
            });
        }

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(starGroup.children.filter(o => o instanceof THREE.Mesh));
            if(hits.length > 0) {
                const d = hits[0].object.userData;
                document.getElementById('obj-name').innerText = d.name;
                document.getElementById('obj-data').innerHTML = `
                    SECTOR: ${d.con}<br>
                    DISTANCE: ${d.dist} LY<br><br>
                    TACTICAL DATA:<br>
                    ${d.fact}
                `;
                document.getElementById('readout').style.display = 'block';
            }
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-btn').style.display = 'none';
            navigator.geolocation.getCurrentPosition(async (p) => {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('camera-feed').srcObject = stream;
                
                if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
                    await DeviceOrientationEvent.requestPermission();
                }
                
                window.addEventListener('deviceorientation', (e) => {
                    // STAGNANT FIX: Use absolute heading and force instant rotation
                    const alpha = e.webkitCompassHeading ? (360 - e.webkitCompassHeading) : e.alpha;
                    const beta = e.beta;
                    const gamma = e.gamma;
                    
                    // Order 'YXZ' prevents the stars from sliding diagonally during a turn
                    camera.rotation.set(
                        THREE.MathUtils.degToRad(beta),
                        THREE.MathUtils.degToRad(alpha),
                        -THREE.MathUtils.degToRad(gamma),
                        'YXZ'
                    );
                }, false);
                
                init(p.coords.longitude);
                document.getElementById('status-text').innerText = "SCANNER ACTIVE";
            });
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
        }
    </script>
</body>
</html>
