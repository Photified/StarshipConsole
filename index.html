<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starship Console Elite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --orange: #ff9900; 
            --pink: #cc99cc; 
            --blue: #9999ff; 
            --gold: #ffcc66; 
            --red: #cc0000; 
            --dark-blue: #08081a;
        }
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: Arial, sans-serif; font-weight: bold; 
            text-transform: uppercase; color: white; 
            user-select: none; -webkit-user-select: none;
            touch-action: none; /* Critical for swipe performance */
        }

        #space-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111122 0%, #000 100%);
            z-index: -1;
        }

        /* RETICLE */
        #reticle {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; 
            border: 2px solid rgba(255, 153, 0, 0.5); border-radius: 50%; 
            pointer-events: none; z-index: 5;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #reticle.locked {
            border-color: #00ff00;
            box-shadow: 0 0 20px #00ff00, inset 0 0 10px #00ff00;
        }

        #lcars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-rows: 140px 1fr 100px;
            pointer-events: none; z-index: 10;
        }

        /* HEADER */
        .header-wrap { display: flex; pointer-events: auto; align-items: flex-start; }
        .elbow-main { width: 120px; height: 120px; background: var(--pink); border-bottom-left-radius: 45px; margin-right: 5px; flex-shrink: 0; }
        .top-bars { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .bar-top { 
            background: var(--orange); height: 50px; 
            border-bottom-left-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 25px; padding-right: 25px;
            color: black; font-size: 20px; 
        }
        .bar-sub { background: var(--blue); height: 15px; width: 85%; border-bottom-left-radius: 10px; }
        
        #nav-data { font-family: monospace; font-size: 16px; color: black; }

        /* SIDEBAR */
        .middle-wrap { display: flex; height: 100%; }
        .sidebar { width: 100px; display: flex; flex-direction: column; gap: 5px; padding-top: 10px; pointer-events: auto; }
        .nav-pill { background: var(--blue); height: 35px; border-radius: 0 20px 20px 0; color: black; font-size: 10px; display: flex; align-items: center; padding-left: 10px; margin-bottom: 2px;}
        
        /* READOUT MODAL */
        #readout { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 350px; background: rgba(0,0,0,0.95); border: 2px solid var(--gold); 
            z-index: 100; padding: 20px; border-radius: 15px; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }
        .readout-title { color: var(--gold); border-bottom: 2px solid var(--gold); margin-bottom: 12px; font-size: 22px; }
        .data-row { margin-bottom: 8px; }
        .data-label { color: var(--blue); font-size: 11px; display: block; }
        .data-value { color: white; font-size: 14px; display: block; margin-top: 2px; }

        .footer-wrap { background: var(--orange); border-top-left-radius: 50px; display: flex; align-items: center; padding-left: 130px; pointer-events: auto; height: 60px; align-self: end; }
        .btn-main { background: var(--gold); border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; color: black; font-size: 14px; }

        .label { 
            position: absolute; color: var(--blue); border-left: 2px solid var(--gold); 
            padding-left: 6px; font-size: 11px; pointer-events: none;
            background: rgba(0,0,0,0.6); white-space: nowrap; display: none;
        }
    </style>
</head>
<body>

    <div id="space-canvas"></div>
    <div id="reticle"></div>

    <div id="lcars-container">
        <div class="header-wrap">
            <div class="elbow-main"></div>
            <div class="top-bars">
                <div class="bar-top">
                    <span id="header-text">SYSTEM STANDBY</span>
                    <span id="nav-data">HDG: 000 | ELV: 00</span>
                </div>
                <div class="bar-sub"></div>
            </div>
        </div>
        <div class="middle-wrap">
            <div class="sidebar">
                <div class="nav-pill" style="background:var(--pink)">ASTROMETRICS</div>
                <div class="nav-pill">V-LINK</div>
                <div class="nav-pill" style="background:var(--orange)">LR-ARRAY</div>
                <div class="nav-pill" style="background:var(--red); margin-top:20px;" onclick="location.reload()">RESET</div>
            </div>
        </div>
        <div class="footer-wrap">
            <button id="start-btn" class="btn-main">ENGAGE SENSORS</button>
        </div>
    </div>

    <div id="readout">
        <div class="readout-title" id="obj-name">SCANNING...</div>
        <div class="data-row"><span class="data-label">DISTANCE</span><span class="data-value" id="obj-dist">--</span></div>
        <div class="data-row"><span class="data-label">COMPOSITION</span><span class="data-value" id="obj-comp">--</span></div>
        <div class="data-row"><span class="data-label">RADIUS</span><span class="data-value" id="obj-size">--</span></div>
        <div class="data-row"><span class="data-label">DATA</span><span class="data-value" id="obj-fact" style="font-style: italic; color: #ccc;">--</span></div>
        <button class="btn-main" style="width:100%; margin-top:15px;" onclick="document.getElementById('readout').style.display='none'">CLOSE</button>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, starGroup;
        
        // SWIPE NAVIGATION VARIABLES
        let isUserInteracting = false;
        let lon = 0, lat = 0;
        let onPointerDownLon = 0, onPointerDownLat = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        const sensitivity = 0.4; // Swipe Speed
        
        // HOVER STATE
        let hoveredStar = null; 

        async function init(userLongitude) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 4000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            starGroup = new THREE.Group();

            // 1. BACKGROUND STARS
            const bgGeo = new THREE.BufferGeometry();
            const bgPos = [];
            for (let i = 0; i < 2000; i++) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = 2 * Math.PI * Math.random();
                const r = 2500;
                bgPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            }
            bgGeo.setAttribute('position', new THREE.Float32BufferAttribute(bgPos, 3));
            scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ color: 0x666699, size: 2 })));

            // 2. LOAD EXTERNAL STARS
            try {
                const response = await fetch('stars.json');
                const stars = await response.json();
                const d = (new Date().getTime() / 86400000) + 2440587.5 - 2451545.0;
                const lst = (280.46 + 360.985 * d + userLongitude) % 360;

                stars.forEach(s => {
                    const raRad = (s.ra * 15 - lst) * (Math.PI/180);
                    const decRad = s.dec * (Math.PI/180);
                    const phi = Math.PI/2 - decRad;
                    
                    const mesh = new THREE.Mesh(
                        new THREE.SphereGeometry(8, 8, 8), 
                        new THREE.MeshBasicMaterial({ color: 0xffffff })
                    );
                    
                    mesh.position.set(
                        1200 * Math.sin(phi) * Math.cos(raRad),
                        1200 * Math.cos(phi),
                        1200 * Math.sin(phi) * Math.sin(raRad)
                    );
                    mesh.userData = s;

                    const el = document.createElement('div');
                    el.className = 'label'; el.innerText = s.name;
                    document.body.appendChild(el);
                    mesh.userData.label = el;
                    starGroup.add(mesh);
                });
                scene.add(starGroup);
            } catch (err) { console.error(err); }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // ATTACH SWIPE LISTENERS
            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update Header Coordinates
            let hdg = Math.round(lon % 360);
            if (hdg < 0) hdg += 360;
            document.getElementById('nav-data').innerText = `HDG: ${hdg.toString().padStart(3, '0')} | ELV: ${Math.round(lat)}`;

            // Camera Look
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );

            camera.lookAt(target);
            renderer.render(scene, camera);

            // Label Positioning
            starGroup.children.forEach(mesh => {
                if(mesh.userData.label) {
                    const v = mesh.position.clone().project(camera);
                    if(v.z < 1 && Math.abs(v.x) < 0.9 && Math.abs(v.y) < 0.9) {
                        mesh.userData.label.style.display = 'block';
                        mesh.userData.label.style.left = `${(v.x * .5 + .5) * window.innerWidth + 15}px`;
                        mesh.userData.label.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
                    } else { mesh.userData.label.style.display = 'none'; }
                }
            });
        }

        // --- SWIPE LOGIC ---
        function onPointerDown(event) {
            if (event.isPrimary === false) return;
            isUserInteracting = true;
            onPointerDownPointerX = event.clientX;
            onPointerDownPointerY = event.clientY;
            onPointerDownLon = lon;
            onPointerDownLat = lat;
        }

        function onPointerMove(event) {
            // 1. If Dragging: Move Camera
            if (isUserInteracting === true) {
                const deltaX = event.clientX - onPointerDownPointerX;
                const deltaY = event.clientY - onPointerDownPointerY;
                lon = (onPointerDownLon - deltaX * sensitivity);
                lat = (onPointerDownLat + deltaY * sensitivity);
                lat = Math.max(-85, Math.min(85, lat)); 
                return; // Stop here, don't check hover while dragging
            }

            // 2. If Not Dragging: Check Hover (Reticle/Mouse)
            const mouse = new THREE.Vector2(0, 0); // Always aim from center for mobile feel
            // If desktop mouse, use actual mouse coords:
            // const mouse = new THREE.Vector2((event.clientX/window.innerWidth)*2-1, -(event.clientY/window.innerHeight)*2+1);
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(starGroup.children);
            
            if(hits.length > 0) {
                const hit = hits[0].object;
                if(hoveredStar !== hit) {
                    if(hoveredStar) hoveredStar.material.color.setHex(0xffffff);
                    hoveredStar = hit;
                    hoveredStar.material.color.setHex(0x00ff00);
                    document.getElementById('reticle').classList.add('locked');
                    document.body.style.cursor = 'pointer';
                }
            } else {
                if(hoveredStar) {
                    hoveredStar.material.color.setHex(0xffffff);
                    hoveredStar = null;
                    document.getElementById('reticle').classList.remove('locked');
                    document.body.style.cursor = 'default';
                }
            }
        }

        function onPointerUp() { isUserInteracting = false; }

        // --- CLICK SELECTION LOGIC ---
        window.addEventListener('click', (e) => {
            // Prevent accidental clicks if we just dragged the screen
            if (Math.abs(e.clientX - onPointerDownPointerX) > 5 || 
                Math.abs(e.clientY - onPointerDownPointerY) > 5) return;

            // 1. Raycast from click position (Desktop precision)
            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1, 
                -(e.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            let hits = raycaster.intersectObjects(starGroup.children);

            // 2. Fallback: If we missed with the mouse, check if we have a "Reticle Lock" (Mobile easy mode)
            if (hits.length === 0 && hoveredStar) {
                showReadout(hoveredStar.userData);
                return;
            }

            if(hits.length > 0) {
                showReadout(hits[0].object.userData);
            }
        });

        function showReadout(d) {
            document.getElementById('obj-name').innerText = d.name;
            document.getElementById('obj-dist').innerText = d.dist ? `${d.dist} LY` : "--";
            document.getElementById('obj-comp').innerText = d.type || "--";
            document.getElementById('obj-size').innerText = d.size || "--";
            document.getElementById('obj-fact').innerText = d.fact;
            document.getElementById('readout').style.display = 'block';
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('header-text').innerText = "SCANNING SECTOR 001";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => init(p.coords.longitude), () => init(0));
            } else { init(0); }
        });
    </script>
</body>
</html>
